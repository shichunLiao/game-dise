<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>底色·妆匣</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* 版面：一張梳妝桌。左邊是你的臉（台上臉一層層疊上去），右邊是眼前這個時段，底下是今天的妝匣。紙本油彩的單一紙面風格。 */
:root {
  color-scheme: light;
  --paper: #f6f1ef;   /* 油彩白 */
  --card: #fcf9f7;    /* 乾淨的卸妝布 */
  --ink: #221c1f;     /* 墨 */
  --ink-2: #5a5156;
  --ink-3: #8b7f84;
  --line: #ddd2d0;
  --rouge: #a8243a;   /* 唱：戲台紅 */
  --mo: #3a3236;      /* 念：墨 */
  --earth: #8f6338;   /* 做：土 */
  --gold: #a8843a;    /* 打、金箔 */
  --gold-2: #efe2c2;
  --su: #ece4dc;      /* 家中牌：素 */
  --pink: #e4b3ba;    /* 顧家臉 */
  --indigo: #2e4256;  /* 黛青：家 */
  --indigo-2: #d9e0e7;
  --night: #1b171c;
  --ash: #cfc6c6;
  --display: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7; }
button { font: inherit; color: inherit; }
p { margin: 0; }
h2, h3 { text-wrap: balance; }
.app { max-width: 1160px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 頂欄 */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
.brand { font-family: var(--display); font-size: 26px; line-height: 1; background: var(--ink); color: var(--card); padding: 7px 10px 5px; letter-spacing: .12em; }
.when { display: flex; flex-direction: column; line-height: 1.25; }
.when b { font-family: var(--display); font-size: 24px; font-weight: 400; }
.when span { font-size: 12px; color: var(--ink-2); letter-spacing: .15em; }
.board { margin-left: auto; display: flex; gap: 6px 16px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.board b { font-family: var(--display); font-size: 24px; font-weight: 400; color: var(--gold); font-variant-numeric: tabular-nums; }
.board .flow b { color: var(--ink); }
.board .line { border: 1px solid var(--rouge); color: var(--rouge); padding: 0 6px; font-size: 12px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { background: none; border: 1px solid var(--ink-3); padding: 4px 12px; font-size: 13px; cursor: pointer; min-height: 34px; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }

/* 梳妝桌 */
.table { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); grid-template-areas: "face head" "face main" "tray tray"; gap: 14px 22px; align-items: start; }
.facezone { grid-area: face; background: var(--card); padding: 14px 16px; border-top: 6px solid var(--ink); }
.head { grid-area: head; background: var(--card); padding: 16px 22px; border-top: 6px solid var(--rouge); min-width: 0; }
.head.home { border-top-color: var(--indigo); }
.head.door { border-top-color: var(--gold); }
.head.night { background: var(--night); color: var(--card); border-top-color: var(--gold); }
.main { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tray { grid-area: tray; background: var(--night); color: var(--card); padding: 12px 16px 14px; }
.tray h3 { font-size: 12px; font-weight: 400; letter-spacing: .25em; color: var(--gold-2); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tray h3 b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .05em; color: var(--card); }
.tray .hint { color: var(--ash); font-size: 12px; margin-top: 8px; }

.sh { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.sh h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.1; letter-spacing: .08em; }
.sh .who { font-size: 13px; color: var(--ink-2); letter-spacing: .15em; }
.night .sh .who { color: var(--gold-2); }
.desc { margin-top: 8px; font-size: 16px; }
.say { font-family: var(--display); font-size: 22px; color: var(--ink-2); margin-top: 6px; line-height: 1.5; }
.night .say { color: var(--gold-2); }
.note { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.night .note { color: var(--ash); }

/* 臉 */
.face { position: relative; width: 100%; max-width: 230px; margin: 0 auto; }
.face svg { width: 100%; height: auto; display: block; }
.face .towel { position: absolute; left: 50%; top: 40%; width: 104px; pointer-events: none; opacity: 0; transform: translate(-150%, -50%) rotate(-10deg); }
.face.helping .towel { animation: helpwipe .8s ease-in-out; }
@keyframes helpwipe { 0% { opacity: 1; transform: translate(-150%, -50%) rotate(-10deg); } 45% { opacity: 1; transform: translate(10%, -20%) rotate(8deg); } 70% { opacity: 1; transform: translate(-60%, -60%) rotate(-6deg); } 100% { transform: translate(60%, -40%) rotate(10deg); opacity: 0; } }
.face.rub { animation: rub .45s; }
@keyframes rub { 30% { transform: translateX(-5px) rotate(-1deg); } 60% { transform: translateX(4px) rotate(1deg); } }
.facecap { font-size: 13px; color: var(--ink-2); text-align: center; margin-top: 6px; }
.layers { list-style: none; padding: 0; margin: 10px 0 0; }
.layers li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.chip { width: 14px; height: 14px; flex: none; display: inline-block; }
.tag { margin-left: auto; font-size: 11px; letter-spacing: .06em; padding: 0 6px; border: 1px solid var(--ink-3); color: var(--ink-2); white-space: nowrap; }
.tag.hot { border-color: var(--rouge); color: var(--rouge); }

/* 卡牌 */
.cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.card { flex: none; width: 76px; height: 108px; border: none; position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 3px 6px; box-shadow: 0 3px 0 rgba(0, 0, 0, .45); text-align: center; }
.card .cg { position: absolute; top: 8px; left: 0; right: 0; font-family: var(--display); font-size: 34px; line-height: 1; }
.card .cn { font-family: var(--display); font-size: 16px; line-height: 1.1; }
.card small { font-size: 10px; line-height: 1.3; opacity: .85; }
.card .two { position: absolute; top: 4px; right: 4px; font-size: 10px; padding: 0 3px; border: 1px solid currentColor; }
.card .ex { position: absolute; top: 4px; left: 4px; font-size: 10px; padding: 0 3px; border: 1px solid currentColor; }
.card .st { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 18px; background: rgba(27, 23, 28, .62); color: var(--card); letter-spacing: .1em; }
.card:disabled { cursor: default; }
.card.off { opacity: .4; }
.card.sel { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-4px); }
.card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.f-sing { background: var(--rouge); color: var(--card); }
.f-speak { background: var(--mo); color: var(--card); }
.f-act { background: var(--earth); color: var(--card); }
.f-fight { background: var(--gold); color: var(--night); }
.f-care, .f-comp, .f-listen, .f-labor, .f-gift { background: var(--su); color: var(--indigo); }
.f-conflict { background: var(--ash); color: var(--night); }
.empty-tray { color: var(--ash); font-size: 13px; padding: 10px 0; }

/* 面板 */
.panel { background: var(--card); padding: 14px 18px 16px; }
.panel h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 8px; letter-spacing: .08em; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel h3 small { font-family: var(--body); font-size: 13px; color: var(--ink-2); letter-spacing: 0; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--card); padding: 8px 14px; cursor: pointer; text-align: left; line-height: 1.35; min-height: 44px; }
.btn small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.btn.main { background: var(--ink); color: var(--card); }
.btn.main small { color: var(--gold-2); }
.btn.go { background: var(--rouge); border-color: var(--rouge); color: var(--card); }
.btn.go small { color: #f3d9dc; }
.btn.gold { background: var(--gold-2); border-color: var(--gold); }
.btn:disabled { opacity: .36; cursor: not-allowed; }
.btn:focus-visible, .tool:focus-visible, .pick:focus-visible, .script:focus-visible, .step:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

/* 早：劇本與妝匣 */
.scripts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.script { border: 1px solid var(--ink-3); background: var(--paper); padding: 10px 12px; text-align: left; cursor: pointer; }
.script[aria-pressed="true"] { border: 2px solid var(--ink); background: var(--card); padding: 9px 11px; }
.script b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.script small { display: block; font-size: 12px; color: var(--ink-2); }
.segs { display: flex; gap: 4px; margin-top: 6px; }
.seg-chip { font-size: 12px; padding: 1px 7px; }
.meter { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0 10px; }
.meter i { width: 16px; height: 22px; border: 1px dashed var(--ink-3); display: block; }
.meter i.on { border: none; }
.meter i.res { background: repeating-linear-gradient(45deg, var(--ash), var(--ash) 3px, transparent 3px, transparent 6px); border: none; }
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; }
.drow { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.drow .nm { flex: 1; min-width: 0; line-height: 1.3; }
.drow .nm b { font-weight: 700; }
.drow .nm small { display: block; font-size: 11px; color: var(--ink-2); }
.drow .cnt { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 3.2em; text-align: center; }
.step { width: 34px; height: 34px; border: 1px solid var(--ink); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
.step:disabled { opacity: .3; cursor: not-allowed; }
.picks { display: flex; gap: 6px; flex-wrap: wrap; }
.pick { border: 1px solid var(--ink); background: var(--card); padding: 6px 14px; cursor: pointer; min-height: 44px; text-align: left; }
.pick[aria-pressed="true"] { background: var(--rouge); border-color: var(--rouge); color: var(--card); }
.pick small { display: block; font-size: 12px; opacity: .85; }

/* 白天：三段 */
.segrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.segrow.cur { background: var(--gold-2); margin: 0 -10px; padding: 8px 10px; }
.segrow .lb { font-family: var(--display); font-size: 22px; line-height: 1.1; }
.segrow .lb small { display: block; font-family: var(--body); font-size: 12px; color: var(--ink-2); }
.minis { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 34px; }
.mini { font-size: 13px; padding: 3px 8px; }
.mini.bad { outline: 2px dashed var(--ink); outline-offset: -2px; }
.minis .slot { width: 28px; height: 28px; border: 1px dashed var(--ink-3); }
.goldline { margin-top: 10px; font-size: 15px; }
.goldline b { font-family: var(--display); font-size: 26px; font-weight: 400; color: var(--gold); }
.stamp { display: inline-block; font-family: var(--display); font-size: 20px; padding: 2px 12px; border: 3px solid var(--rouge); color: var(--rouge); transform: rotate(-4deg); letter-spacing: .2em; margin-left: 8px; }
.stamp.fail { border-color: var(--ink-2); color: var(--ink-2); }

/* 傍晚 */
.reacts { list-style: none; padding: 0; margin: 0; }
.reacts li { padding: 8px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.reacts .rk { font-family: var(--display); font-size: 18px; text-align: center; border: 1px solid var(--ink-3); padding: 0 4px; }
.reacts .rk.up { border-color: var(--indigo); color: var(--indigo); }
.reacts .rk.down { border-color: var(--rouge); color: var(--rouge); }
.reacts .rk.none { color: var(--ink-3); }
.reacts .tx { font-size: 15px; }
.reacts .gain { display: block; font-size: 13px; color: var(--gold); }
.lampbox { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
.lampbox svg { width: 54px; height: 66px; flex: none; }

/* 夜與更夫 */
.watch-line { font-family: var(--display); font-size: 26px; line-height: 1.6; margin-top: 10px; animation: rise .9s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.daysum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-2); }
.daysum b { color: var(--ink); font-variant-numeric: tabular-nums; }
.rope { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.rope i { width: 18px; height: 22px; display: block; clip-path: polygon(0 0, 100% 0, 92% 100%, 50% 88%, 8% 100%); }

/* 週考核 */
.grid22 { display: grid; grid-template-columns: auto 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 10px; }
.grid22 > div { background: var(--card); padding: 8px 10px; font-size: 14px; }
.grid22 .h { background: var(--paper); font-size: 12px; color: var(--ink-2); letter-spacing: .08em; }
.grid22 .hit { background: var(--gold-2); outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.wb { margin-top: 12px; border-top: 2px solid var(--ink); max-width: 420px; }
.wb div { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
.wb .me { font-weight: 700; color: var(--rouge); }
.wb .last { color: var(--ink-3); }

/* 開場 */
.start { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: start; max-width: 980px; margin: 3vh auto 0; }
.vboard { background: var(--ink); color: var(--card); font-family: var(--display); padding: 30px 22px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.vboard::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gold); pointer-events: none; }
.vboard .t { writing-mode: vertical-rl; font-size: 92px; line-height: 1; letter-spacing: .12em; }
.vboard .s { writing-mode: vertical-rl; font-size: 17px; color: var(--gold-2); letter-spacing: .3em; }
.intro { font-family: var(--display); font-size: 25px; line-height: 1.75; }
.lede { margin-top: 10px; color: var(--ink-2); max-width: 40em; }
.form { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; }
.field label { display: block; font-size: 13px; letter-spacing: .2em; color: var(--ink-2); margin-bottom: 6px; }
.field input { font: inherit; font-size: 18px; padding: 7px 12px; border: 1px solid var(--ink); background: var(--card); width: 9em; }
.roles .pick { font-family: var(--display); font-size: 22px; min-width: 52px; text-align: center; }
.rules-card { background: var(--card); padding: 14px 20px 16px; margin-top: 22px; font-size: 14px; border-left: 5px solid var(--gold); }
.rules-card h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 4px; letter-spacing: .1em; }
.rules-card ol { margin: 0; padding-left: 1.4em; }
.rules-card li + li { margin-top: 3px; }

/* 對話框 */
.backdrop { position: fixed; inset: 0; background: rgba(27, 23, 28, .55); z-index: 20; }
.modal { position: fixed; z-index: 21; left: 50%; top: max(5vh, env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(680px, calc(100% - 32px)); max-height: 88vh; overflow: auto; background: var(--card); padding: 20px 24px 24px; border-top: 6px solid var(--ink); }
.modal h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 8px; letter-spacing: .1em; }
.modal h3 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 16px 0 6px; }
.modal ol { padding-left: 1.4em; margin: 0; }
.modal li + li { margin-top: 4px; }
.modal .close { position: absolute; right: 12px; top: 10px; }
.shoprow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.shoprow .card { width: 60px; height: 84px; cursor: default; box-shadow: none; }
.shoprow .card .cg { font-size: 26px; top: 6px; }
.shoprow .card .cn { font-size: 13px; }
.shoprow .info { flex: 1; min-width: 0; font-size: 14px; }
.shoprow .info small { display: block; color: var(--ink-2); }
.ledger { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.ledger b { font-variant-numeric: tabular-nums; }

/* 揭曉 */
.reveal { max-width: 900px; margin: 0 auto; }
.rv { background: var(--card); padding: 26px 28px 28px; border-top: 6px solid var(--gold); }
.rv h2 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.2; margin: 0 0 8px; letter-spacing: .1em; }
.rv .big { font-family: var(--display); font-size: 23px; line-height: 1.7; }
.rv .actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.rv h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 22px 0 6px; letter-spacing: .08em; }
.days { overflow-x: auto; }
.days table { border-collapse: collapse; font-size: 12px; min-width: 640px; }
.days th { font-weight: 400; color: var(--ink-3); padding: 2px; text-align: center; }
.days th.rh { text-align: left; font-family: var(--display); font-size: 18px; color: var(--ink); padding-right: 10px; white-space: nowrap; }
.days td { padding: 2px; text-align: center; vertical-align: middle; }
.days td i { display: block; width: 16px; height: 9px; margin: 2px auto; }
.days td .none { border: 1px dashed var(--ink-3); height: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 14px; }
.chart svg { width: 100%; height: auto; display: block; max-width: 640px; }
.facts { margin-top: 10px; padding-left: 1.2em; font-size: 15px; }
.facts li + li { margin-top: 3px; }
.needs { list-style: none; padding: 0; margin: 0; }
.needs li { padding: 8px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.needs b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.needs .ok { color: var(--indigo); }
.needs .no { color: var(--ink-3); }
.ending { margin-top: 16px; padding: 24px 26px; }
.ending h3 { font-family: var(--display); font-weight: 400; font-size: 60px; line-height: 1.1; margin: 0; letter-spacing: .15em; }
.ending .cond { font-size: 13px; letter-spacing: .12em; opacity: .8; margin-top: 4px; }
.ending .tx { font-family: var(--display); font-size: 25px; line-height: 1.7; margin-top: 14px; }
.end-liubai { background: var(--paper); border: 1px solid var(--line); }
.end-suian { background: var(--indigo-2); }
.end-toupai { background: var(--gold-2); }
.end-gengfu { background: var(--night); color: var(--card); }
.night-line { font-family: var(--display); font-size: 25px; margin-top: 12px; }

#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.fleck { position: absolute; top: -14px; width: 10px; height: 8px; background: var(--gold); animation: fall 1.7s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(560deg); opacity: .15; } }
@media (prefers-reduced-motion: reduce) {
  .fleck { display: none; }
  .watch-line, .face.helping .towel, .face.rub { animation: none !important; }
}

@media (max-width: 780px) {
  .table { grid-template-columns: 124px minmax(0, 1fr); grid-template-areas: "head head" "face main" "tray tray"; gap: 12px; }
  .facezone { padding: 8px; border-top-width: 4px; position: sticky; top: env(safe-area-inset-top, 0px); }
  .facecap { font-size: 11px; }
  .layers li { font-size: 11.5px; gap: 5px; padding: 2px 0; }
  .layers .tag { display: none; }
  .head { padding: 12px 16px; }
  .sh h2 { font-size: 28px; }
  .desc { font-size: 15px; }
  .panel { padding: 12px 12px 14px; }

function viewFace() {
  const t = S.T, ph = S.phase;
  const evening = ph === 'evening';
  const gu = evening ? t.home.filter(id => FAM[fOf(S, id)].mask === 'gu').length : 0;
  const zhen = evening && t.home.some(id => FAM[fOf(S, id)].mask === 'zhen');
  const mirror = ph === 'watch' && S.day === R.mirrorDay;
  const layers = t.layers.slice().reverse().map((L, i) => `<li>${famChip(L.f)}${FAM[L.f].n} · 台上脸${L.carry ? '（上周留下）' : ''}${i === 0 ? '<span class="tag hot">最上层</span>' : ''}</li>`).join('');
  const extra = evening ? `${gu ? `<li>${famChip('care')}顾家脸 ×${gu}</li>` : ''}<li>${famChip('comp')}真脸${zhen ? '<span class="tag">露出来了</span>' : ''}</li>` : '';
  const cap = t.layers.length ? `脸上 ${t.layers.length} 层台上脸` : mirror ? '镜子里的底色' : '脸上没有台上脸';
  return `<div class="facezone">
    <div class="face ${flash === 'wipe' ? 'helping' : flash === 'rub' ? 'rub' : ''}">${faceSVG(t.layers, { gu, zhen, base: mirror ? S.base : 0 })}${TOWEL}</div>
    <p class="facecap">${cap}</p>
    <ul class="layers">${layers}${extra}</ul>
  </div>`;
}

function viewTray() {
  const t = S.T, ph = S.phase;
  const ids = t.box.slice().sort((a, b) => (isStage(fOf(S, a)) === isStage(fOf(S, b)) ? 0 : isStage(fOf(S, a)) ? -1 : 1));
  const actOf = id => {
    const f = fOf(S, id);
    if (ph === 'stage') return isStage(f) ? 'play-stage' : null;
    if (ph === 'door' || ph === 'night') return canClean(S, id) ? 'sel' : null;
    if (ph === 'evening') return !isStage(f) ? 'play-home' : null;
    if (ph === 'morning') return tOf(S, id).sticky ? null : 'unbox';
    return null;
  };
  const offOf = id => (ph === 'stage' && !canStage(S, id)) || (ph === 'evening' && !canHome(S, id)) || ((ph === 'door' || ph === 'night') && !canClean(S, id));
  const used = sumSlots(S, t.box), free = capFree(S);
  const hint = { morning: '点牌可以把它拿出妆匣。', stage: '点演戏牌，放进当前这一段。', door: '先点一张牌，再按「用这张卸一层」。', evening: '点家中牌，按顺序打出。', night: '先点一张剩下的牌，再按「用这张卸一层」。' }[ph] || '';
  return `<div class="tray">
    <h3><span>今天的妆匣 <b>${used} / ${free}</b> 张位${t.reserved ? `（另有 ${t.reserved} 位留给${t.special === 'night' ? '夜场' : '生日'}）` : ''}</span><span>剩 ${t.box.filter(id => !t.used[id]).length} 张没用</span></h3>
    ${ids.length ? `<div class="cards">${ids.map(id => cardHTML(id, actOf(id), { off: offOf(id) })).join('')}</div>` : '<p class="empty-tray">妆匣还是空的。</p>'}
    ${hint ? `<p class="hint">${hint}</p>` : ''}
  </div>`;
}

function viewMorning() {
  const t = S.T, kind = specialOf(S), sc = scriptsOf(S), used = sumSlots(S, t.box), free = capFree(S);
  const desc = MORNING[S.day] || MORNING_ROT[(S.day - 1) % MORNING_ROT.length];
  let special = '';
  if (kind === 'bday') special = `<div class="panel"><h3>阿檀的生日 <small>二选一</small></h3><div class="picks">
      <button class="pick" data-act="choose" data-arg="night" aria-pressed="${t.special === 'night'}">加演夜场<small>替小凤唱：金箔 +6，占 2 张位</small></button>
      <button class="pick" data-act="choose" data-arg="bday" aria-pressed="${t.special === 'bday'}">陪她过生日<small>金箔不增，占 1 张陪伴位</small></button></div></div>`;
  if (kind === 'yuan') special = `<div class="panel"><h3>元宵 <small>三选一</small></h3><div class="picks">
      <button class="pick" data-act="choose" data-arg="stage" aria-pressed="${t.special === 'stage'}">上台<small>最后一场，金箔 ×2</small></button>
      <button class="pick" data-act="choose" data-arg="lamp" aria-pressed="${t.special === 'lamp'}">回家点灯<small>今天不上台</small></button>
      <button class="pick" data-act="choose" data-arg="cover" aria-pressed="${t.special === 'cover'}">替小凤代演<small>金箔记在她名下</small></button></div></div>`;
  const meter = Array.from({ length: t.cap }, (_, i) => {
    if (i >= free) return '<i class="res"></i>';
    return '<i></i>';
  });
  let k = 0;
  t.box.forEach(id => { const s = slotsOf(S, id); for (let j = 0; j < s && k < free; j++, k++) meter[k] = `<i class="on" style="background:${FCOL[fOf(S, id)]};${isStage(fOf(S, id)) ? '' : `outline:1px solid ${COL.ink3};outline-offset:-1px`}"></i>`; });
  // 卡組按牌名分組
  const order = ['sing', 'speak', 'act', 'fight', 'care', 'comp', 'listen', 'labor', 'gift', 'conflict'];
  const groups = [];
  S.deck.forEach(c => { let g = groups.find(x => x.t === c.t); if (!g) groups.push(g = { t: c.t, ids: [] }); g.ids.push(c.id); });
  groups.sort((a, b) => order.indexOf(T[a.t].f) - order.indexOf(T[b.t].f));
  const rows = groups.map(g => {
    const tp = T[g.t], inBox = g.ids.filter(id => t.box.includes(id)).length, s2 = slotsT(g.t) === 2;
    const canPlus = inBox < g.ids.length && used + slotsT(g.t) <= free;
    const sub = isStage(tp.f) ? `${FAM[tp.f].n} · 金 ${tp.g} · 残留：${FAM[tp.f].res.split('：')[0]}` : `${FAM[tp.f].n} · ${FAM[tp.f].eff}`;
    return `<div class="drow">${famChip(tp.f)}<span class="nm"><b>${tp.n}</b>${s2 ? ' · 2 张位' : ''}${tp.ex ? ' · 专属' : ''}${tp.sticky ? ' · 必带' : ''}<small>${sub}</small></span>
      <button class="step" data-act="minus" data-arg="${g.t}" ${inBox && !tp.sticky ? '' : 'disabled'} aria-label="${tp.n}少带一张">−</button>
      <span class="cnt">${inBox} / ${g.ids.length}</span>
      <button class="step" data-act="plus" data-arg="${g.t}" ${canPlus ? '' : 'disabled'} aria-label="${tp.n}多带一张">＋</button></div>`;
  }).join('');
  return `<div class="head"><div class="sh"><h2>早</h2><span class="who">装妆匣 · 选剧本</span></div>
      <p class="desc">${desc}</p>${t.notes.map(n => `<p class="note">${n}</p>`).join('')}
      <p class="say">今天的妆匣，装得下 ${t.cap} 张位。</p></div>
    <div class="main">
      ${viewLedger()}
      ${special}
      <div class="panel"><h3>剧本 <small>本周开放 ${sc.length} 个，选一个</small></h3><div class="scripts">${sc.map((s, i) => `<button class="script" data-act="script" data-arg="${i}" aria-pressed="${t.script === i}">
          <b>${s.n}</b>${s.yuan ? '<small>元宵剧本</small>' : ''}<small>${TAGN[s.tag]}：${FAM[s.tag].n}每张 +1</small>
          <span class="segs">${s.segs.map((f, j) => `<span class="seg-chip f-${f}">${SEG_N[j]} · ${FAM[f].n}</span>`).join('')}</span></button>`).join('')}</div>
        <p class="hint">最后一段的牌在脸上的最上层，没清掉就会把它的残留带进门。</p></div>
      <div class="panel"><h3>装妆匣 <small>${used} / ${free} 张位</small></h3>
        <div class="meter" aria-hidden="true">${meter.join('')}</div>
        <div class="row-btns">
          <button class="btn" data-act="yesterday" ${S.lastBox ? '' : 'disabled'}>照昨天装</button>
          <button class="btn" data-act="clear">全部倒出来</button>
          <button class="btn gold" data-act="shop">戏箱<small>${S.bought ? '本周已买过' : '班主处，本周可买 1 张'}</small></button>
          <button class="btn gold" data-act="market">市集<small>家中卡、礼物${S.lampSold ? '、灯料' : ''}</small></button>
          <button class="btn" data-act="lib">卡组 ${S.deck.length} 张<small>收起或取回普通卡</small></button>
        </div>
        <div class="deck" style="margin-top:12px">${rows}</div></div>

function boardRows(rank) {

function viewPlay() {
  const ph = S.phase;
  const body = { morning: viewMorning, stage: viewStage, door: viewDoor, evening: viewEvening, night: viewNight, watch: viewWatch, week: viewWeek }[ph]();

  return `${viewBar()}<div class="table">${viewFace()}${body}${tray}</div>`;

// ── 季末揭曉 ─────────────────────────────────────────
function chartSVG() {
  const L = S.log, W = 600, H = 170, l = 34, r = 10, top = 10, bot = 26;
  const x = d => l + ((d - 1) / (R.days - 1)) * (W - l - r), y = v => top + (1 - v / 5) * (H - top - bot);
  let g = '';
  for (let v = 0; v <= 5; v++) g += `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="${COL.line}" stroke-width="1"/><text x="${l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${COL.ink2}">${v}</text>`;
  [1, 7, 14, 21, 28].forEach(d => { g += `<text x="${x(d)}" y="${H - 8}" text-anchor="${d === R.days ? 'end' : 'middle'}" font-size="11" fill="${COL.ink2}">第${d}天</text>`; });
  const series = [['calm', COL.indigo, '安心'], ['seen', COL.gold, '被看见'], ['rift', COL.rouge, '裂痕']];
  series.forEach(([k, c]) => {
    const pts = L.map(e => `${x(e.day).toFixed(1)},${y(e[k]).toFixed(1)}`).join(' ');
    if (pts) g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const e = L[L.length - 1];
    if (e) g += `<circle cx="${x(e.day)}" cy="${y(e[k])}" r="4" fill="${c}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="安心、被看见、裂痕每天的变化">${g}</svg>`
    + `<div class="legend">${series.map(([, c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}<span>（裂痕到 4 就崩盘）</span></div>`;
}
function daysTable() {
  const cell = arr => (arr.length ? arr.map(e => `<i style="background:${FCOL[e.f]};${e.f === 'home' ? `outline:1px solid ${COL.ink3};outline-offset:-1px` : ''}"></i>`).join('') : '<i class="none"></i>');
  const days = Array.from({ length: R.days }, (_, i) => i + 1);
  return `<div class="days"><table><tr><th></th>${days.map(d => `<th>${d}</th>`).join('')}</tr>
    <tr><th class="rh">木匣</th>${days.map(d => `<td>${cell(S.chest.filter(e => e.day === d))}</td>`).join('')}</tr>
    <tr><th class="rh">晾绳</th>${days.map(d => `<td>${cell(S.rope.filter(e => e.day === d))}</td>`).join('')}</tr></table></div>
    <div class="legend"><span><i style="background:${FCOL.sing}"></i>红：唱</span><span><i style="background:${FCOL.speak}"></i>墨：念</span><span><i style="background:${FCOL.act}"></i>土：做</span><span><i style="background:${FCOL.fight}"></i>金：打</span><span><i style="background:${FCOL.home};outline:1px solid ${COL.ink3}"></i>素：家中牌</span><span><i style="border:1px dashed ${COL.ink3}"></i>空着</span></div>`;
}
function viewEnd() {
  const pass = S.rank < R.ranks, rows = boardRows(S.rank);
  if (reveal === 0) {

      <div class="wb">${rows.map((n, i) => `<div class="${n === '你' ? 'me' : ''} ${i === rows.length - 1 ? 'last' : ''}"><span>${i + 1}　${n === '你' ? `${esc(S.name)}（你）` : n}</span><span>${i === rows.length - 1 ? '摘牌' : ''}</span></div>`).join('')}</div>
      <div class="stamp ${pass ? '' : 'fail'}" style="margin:14px 0 0">${pass ? '留在水牌上' : '末位 · 摘牌'}</div>

  if (reveal === 1) {

    return `<div class="reveal"><section class="rv"><h2>两样东西</h2>
      <p class="big">桌上摆着阿檀的木匣，窗外挂着你的晾绳。木匣里是她在门口替你擦脸用过的布；晾绳上是你自己卸妆弃掉的牌。</p>
      ${daysTable()}
      <h3>她心里的账</h3><div class="chart">${chartSVG()}</div>
      <p class="hint">底色一共 ${S.base}。</p>
      <h3>她每一幕想要的</h3><ul class="needs">${needs}</ul>
      <h3>你本来可以知道的</h3><ul class="facts">
        <li>妆匣比 15 张位小的日子有 ${f.small} 天，比 15 大的有 ${f.big} 天。</li>
        <li>她没有在门口替你擦脸的日子有 ${f.noWipe} 天。</li>
        <li>带着台上脸进门的日子有 ${f.res} 天，空宅 ${f.empty} 天，带着戏脸睡的夜有 ${f.red} 个。</li>
        <li>周考核里，关系线失守了 ${f.relFail} 次。</li>
        <li>一共作废了 ${f.wasted} 张牌。</li></ul>
      <div class="actions"><button class="btn go" data-act="rv-next">五更天</button></div></section></div>`;
  }
  const e = ENDINGS[endingOf(S)];
  return `<div class="reveal"><section class="rv"><p class="night-line">五更天，窗外有人在喊「${esc(S.name)}」。</p>
    <div class="face" style="margin-top:12px;max-width:200px">${faceSVG([], { base: S.base })}</div>
    <div class="ending ${e.cls}"><h3>${e.name}</h3><p class="cond">${e.cond}</p><p class="tx">${e.text(S)}</p></div>
    <div class="actions"><button class="btn go" data-act="again">再唱一季</button><button class="btn" data-act="home">回到开场</button></div></section></div>`;
}

// ── 對話框 ───────────────────────────────────────────
function viewModal() {
  let body = '';
  if (modal === 'rules') body = `<h2>规矩</h2><ol>${RULES.map(r => `<li>${r}</li>`).join('')}</ol><h3>原型自定的部分</h3><p class="hint">v0.3 没写死的数值和规则，原型先这样定，方便试玩后再调。</p><ol>${ASSUME.map(r => `<li>${r}</li>`).join('')}</ol>`;
  if (modal === 'restart') body = `<h2>重来？</h2><p>这一季的进度会清掉，回到开场。</p><div class="row-btns" style="margin-top:14px"><button class="btn go" data-act="restart-yes">重来</button><button class="btn" data-act="close">接着唱</button></div>`;
  if (modal === 'shop') {
    const list = SHOP[weekOf(S.day) - 1];
    body = `<h2>戏箱</h2><p class="hint">班主处。每周开 3 张演戏卡，最多买 1 张。你有 ${S.gold} 金箔。</p>${list.map(t => {
      const tp = T[t], can = !S.bought && S.gold >= tp.price;
      return `<div class="shoprow"><div class="card f-${tp.f}"><span class="cg">${GLYPH[tp.f]}</span><span class="cn">${tp.n}</span></div>
        <div class="info">${tp.n} · ${FAM[tp.f].n}${slotsT(t) === 2 ? ' · 2 张位' : ''}<small>金 ${tp.g} · 残留：${FAM[tp.f].res}</small></div>
        <button class="btn" data-act="buy-shop" data-arg="${t}" ${can ? '' : 'disabled'}>${tp.price} 金箔</button></div>`;
    }).join('')}`;
  }
  if (modal === 'market') {
    const items = MARKET.map(t => {
      const tp = T[t];
      return `<div class="shoprow"><div class="card f-${tp.f}"><span class="cg">${GLYPH[tp.f]}</span><span class="cn">${tp.n}</span></div>
        <div class="info">${tp.n} · ${FAM[tp.f].n}${slotsT(t) === 2 ? ' · 2 张位' : ''}<small>${FAM[tp.f].eff}</small></div>
        <button class="btn" data-act="buy-market" data-arg="${t}" ${S.gold >= tp.price ? '' : 'disabled'}>${tp.price} 金箔</button></div>`;
    }).join('');
    const lamp = S.lampSold ? `<div class="shoprow"><div class="card f-labor"><span class="cg">灯</span><span class="cn">灯料</span></div><div class="info">灯料<small>买了直接糊上去：灯进度 +1</small></div><button class="btn" data-act="buy-market" data-arg="lamp" ${S.gold >= R.lampPrice ? '' : 'disabled'}>${R.lampPrice} 金箔</button></div>` : '';
    body = `<h2>市集</h2><p class="hint">常驻。你有 ${S.gold} 金箔。</p>${items}${lamp}`;
  }
  if (modal === 'lib') {
    const deck = S.deck.map(c => {
      const tp = T[c.t], lock = tp.ex || tp.sticky;
      return `<div class="shoprow"><div class="card f-${tp.f}"><span class="cg">${GLYPH[tp.f]}</span><span class="cn">${tp.n}</span></div><div class="info">${tp.n} · ${FAM[tp.f].n}<small>${lock ? (tp.sticky ? '必带，不能收起' : '专属卡，不能卸下') : '普通卡'}</small></div>
        <button class="btn" data-act="stash" data-arg="${c.id}" ${lock ? 'disabled' : ''}>收进卡库</button></div>`;
    }).join('');
    const lib = S.lib.map(c => {
      const tp = T[c.t];
      return `<div class="shoprow"><div class="card f-${tp.f}"><span class="cg">${GLYPH[tp.f]}</span><span class="cn">${tp.n}</span></div><div class="info">${tp.n} · ${FAM[tp.f].n}</div>
        <button class="btn" data-act="unstash" data-arg="${c.id}" ${S.deck.length < R.deckCap ? '' : 'disabled'}>取回卡组</button></div>`;
    }).join('');
    body = `<h2>卡组 ${S.deck.length} / ${R.deckCap}</h2>${deck}<h3>卡库 ${S.lib.length}</h3>${lib || '<p class="hint">卡库是空的。</p>'}`;
  }
  return `<div class="backdrop" data-act="close"></div><div class="modal" role="dialog" aria-modal="true">${body}<button class="tool close" data-act="close">关上</button></div>`;
}

function render() {
  app.innerHTML = (!S ? viewStart() : S.phase === 'end' ? viewEnd() : viewPlay()) + (modal ? viewModal() : '');
  flash = null;
}

function burst(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = document.getElementById('fx');
  for (let i = 0; i < Math.min(n, 40); i++) {
    const f = document.createElement('span');
    f.className = 'fleck';
    f.style.left = `${10 + Math.random() * 80}vw`;
    f.style.animationDelay = `${Math.random() * 0.4}s`;
    f.style.background = Math.random() < 0.3 ? COL.gold2 : COL.gold;
    fx.appendChild(f);
    setTimeout(() => f.remove(), 2400);
  }
}

app.addEventListener('input', e => { if (e.target.id === 'nm') draftName = e.target.value; });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, arg = b.dataset.arg, id = Number(arg);
  const g0 = S ? S.gold : 0, ph0 = S ? S.phase : null;
  switch (a) {
    case 'role': pickRole = arg; break;
    case 'start': S = newGame((draftName.trim() || '小满').slice(0, 6), pickRole); reveal = 0; break;
    case 'resume': S = saved; saved = null; reveal = 0; break;
    case 'rules': case 'shop': case 'market': case 'lib': case 'restart': modal = a; break;
    case 'close': modal = null; break;
    case 'restart-yes': S = null; modal = null; saved = null; break;
    case 'ledger': showLedger = !showLedger; break;
    case 'choose': choose(S, arg); break;
    case 'script': pickScript(S, id); break;
    case 'plus': stepTpl(S, arg, 1); break;
    case 'minus': stepTpl(S, arg, -1); break;
    case 'unbox': toggleBox(S, id); break;
    case 'clear': clearBox(S); break;
    case 'yesterday': boxYesterday(S); break;
    case 'buy-shop': buyShop(S, arg); break;
    case 'buy-market': buyMarket(S, arg); break;
    case 'stash': stash(S, id); break;
    case 'unstash': unstash(S, id); break;
    case 'depart': depart(S); break;
    case 'play-stage': playStage(S, id); break;
    case 'undo': undoStage(S); break;
    case 'next-seg': nextSeg(S); break;
    case 'end-stage': endStage(S); break;
    case 'wipe': wipe(S); flash = 'wipe'; break;
    case 'sel': sel = sel === id ? null : id; break;
    case 'clean': selfClean(S, sel); sel = null; flash = 'rub'; break;
    case 'enter': enterHome(S); break;
    case 'play-home': playHome(S, id); break;
    case 'end-evening': endEvening(S); break;
    case 'sleep': sleep(S); break;
    case 'dawn': dawn(S); break;
    case 'next-week': nextWeek(S); reveal = 0; break;
    case 'rv-next': reveal += 1; break;
    case 'again': S = newGame(S.name, S.role); reveal = 0; break;
    case 'home': S = null; reveal = 0; break;
  }
  if (S && S.phase !== ph0) { sel = null; window.scrollTo({ top: 0 }); }
  if (a === 'rv-next') window.scrollTo({ top: 0 });
  save();
  render();
  if (S && S.gold > g0 && a === 'end-stage') burst((S.gold - g0) * 2);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) { modal = null; render(); } });

// 測試用：在瀏覽器主控台裡跑規則引擎
window.__dise = { R, T, newGame, choose, toggleBox, stepTpl, pickScript, depart, playStage, endStage, wipe, selfClean, enterHome, playHome, endEvening, sleep, dawn, nextWeek, goldOf, endingOf, buyShop, buyMarket };

window.claude?.hot?.snapshot?.(() => ({ S, pickRole, draftName, reveal }));
const boot = data => {
  if (data && data.S) { S = data.S; pickRole = data.pickRole || pickRole; draftName = data.draftName || draftName; reveal = data.reveal || 0; }
  else saved = load();
  render();
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
