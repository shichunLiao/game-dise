<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>底色·戏城 多样版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* 版面：一張 3D 的戲班桌子墊底，牌和字用 2D 浮在上面。沒有血條：金、燈、痕、底色都擺在桌上看。 */
:root {
  color-scheme: dark;
  --ink: #120e11;
  --ink-2: #1a1417;
  --paper: #ece3d4;
  --paper-2: #d6cab6;
  --wash: #8d8487;
  --red: #a8202b;
  --red-2: #d8434c;
  --gold: #b8913f;
  --wood: #4a2f1e;
  --display: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.6; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
p { margin: 0; }
#gl, #smear, #vig, #grain, #stagefx { position: fixed; inset: 0; width: 100%; height: 100%; }
#stagefx { pointer-events: none; }
/* 連擊的大字：墨書蓋上來，一會兒就散 */
#combo { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); pointer-events: none; z-index: 29; text-align: center; }
#combo .cb { font-family: var(--display); font-size: clamp(44px, 8vw, 96px); line-height: 1; letter-spacing: .12em; color: #f6dc96; text-shadow: 0 0 2px #3a0a0e, 0 4px 0 #7d1219, 0 0 30px rgba(242, 212, 138, .7); animation: cbIn 1.5s cubic-bezier(.2, 1.4, .4, 1) both; white-space: nowrap; }
#combo .cb.big { color: #fff1c8; font-size: clamp(56px, 10vw, 124px); text-shadow: 0 0 2px #3a0a0e, 0 5px 0 #a8202b, 0 0 46px rgba(255, 200, 120, .95); }
#combo .cb.bad { color: #c9c0c2; text-shadow: 0 3px 0 #1c1719, 0 0 18px rgba(0, 0, 0, .8); font-size: clamp(36px, 6vw, 70px); }
#combo .cs { font-family: var(--body); font-size: 16px; letter-spacing: .3em; color: #f2d48a; text-shadow: 0 2px 6px #000; animation: cbIn 1.5s ease both; }
@keyframes cbIn { 0% { opacity: 0; transform: scale(2.2) rotate(-6deg); filter: blur(6px); } 14% { opacity: 1; transform: scale(.94) rotate(-2deg); filter: none; } 22% { transform: scale(1) rotate(-2deg); } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px) rotate(-2deg); } }
.gainf { position: fixed; z-index: 30; pointer-events: none; font-family: var(--display); font-size: 34px; color: #f6dc96; text-shadow: 0 2px 0 #7d1219, 0 0 14px rgba(242, 212, 138, .8); transform: translate(-50%, -50%); animation: gainUp 1.2s ease-out both; }
.gainf.bad { color: #d8c6c8; text-shadow: 0 2px 0 #1c1719; }
@keyframes gainUp { from { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } to { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
.bub.intel { animation: bubIn .28s cubic-bezier(.2, 1.4, .4, 1) both, intelGlow 1.6s ease-in-out .3s infinite; }
@keyframes intelGlow { 50% { box-shadow: 0 0 0 7px rgba(242, 212, 138, .28), 0 0 40px rgba(242, 212, 138, .85), 0 10px 26px rgba(0, 0, 0, .6); } }
#gl { display: block; }
#smear, #vig, #grain { pointer-events: none; }
#vig { background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(8, 6, 7, .72) 100%); }
#grain { opacity: .18; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 1 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"); }

/* 浮層 */
.hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding-block: max(12px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: flex-start; gap: 12px; }
/* 木牌：第幾天、起手族、金箔 */
.plate { flex: none; min-width: 112px; background: linear-gradient(180deg, #5c3b25, #3d2717); border: 1px solid #1d120b; box-shadow: inset 0 0 0 2px rgba(236, 200, 150, .14), 0 6px 18px rgba(0, 0, 0, .55); padding: 7px 12px 8px; color: #f0e2c8; text-align: center; }
.plate .d { font-family: var(--display); font-size: 21px; line-height: 1.15; }
.plate .a { font-size: 11px; letter-spacing: .25em; color: #c9b08c; }
.plate .st { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; font-size: 12px; letter-spacing: .1em; }
.plate .g { margin-top: 4px; font-size: 12px; color: #e0c98f; font-variant-numeric: tabular-nums; }
.plate .g b { font-family: var(--display); font-weight: 400; font-size: 20px; margin-left: 4px; }
.fc { font-style: normal; display: inline-flex; width: 26px; height: 26px; border-radius: 50%; align-items: center; justify-content: center; font-family: var(--display); font-size: 17px; line-height: 1; color: var(--paper); border: 1px solid rgba(236, 227, 212, .75); flex: none; }
.topmid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.side { flex: none; pointer-events: auto; }
.tool { white-space: nowrap; background: rgba(18, 14, 17, .6); border: 1px solid rgba(236, 227, 212, .35); color: var(--paper); padding: 3px 10px; font-size: 12px; cursor: pointer; min-height: 30px; }

/* 妝匣：10 個格子，異常出現在這裡 */
.tray { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 158px; display: grid; grid-template-columns: repeat(2, 34px); gap: 4px; padding: 6px; background: rgba(50, 16, 16, .72); border: 1px solid rgba(184, 145, 63, .55); }
.slot { height: 44px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 15px; line-height: 1; color: var(--paper); border: 1px dashed rgba(236, 227, 212, .3); position: relative; }
.slot.on { border: 1px solid rgba(236, 227, 212, .45); }
.slot.jie { border: 2px solid var(--gold); }
.slot.done { filter: saturate(.3) brightness(.5); }
.slot.done::after { content: attr(data-u); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--body); font-size: 11px; background: rgba(0, 0, 0, .25); }
.slot.gone { border: none; background: radial-gradient(circle at 40% 35%, #a8243a 0 22%, #5e1420 45%, #2a0a10 80%); }

.mid { flex: 1; min-height: 0; position: relative; }
/* 白天：這一場出過的牌與連擊 */
.chain { pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.played { display: flex; align-items: center; gap: 2px; }
.pl { width: 56px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; font-family: var(--display); font-size: 16px; color: var(--paper); border: 1px solid rgba(236, 227, 212, .35); }
.pl small { font-family: var(--body); font-size: 11px; color: #f4dfa8; font-variant-numeric: tabular-nums; }
.pl.no { background: rgba(18, 14, 17, .45); border-style: dashed; }
.lk { width: 12px; text-align: center; font-size: 12px; color: var(--gold); }
.lk.x { color: var(--red-2); }
.nowline { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 1px 12px; background: rgba(18, 14, 17, .62); font-size: 14px; text-shadow: 0 1px 4px #000; }
.nowline b { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--gold); }
.nowline .bad { color: var(--red-2); }
.nx { animation: nxflash .9s ease-in-out infinite; }
@keyframes nxflash { 50% { box-shadow: 0 0 0 5px rgba(236, 227, 212, .28), 0 0 14px rgba(236, 227, 212, .6); } }
/* 她的樣子：畫面為主，放大（滑過、聚焦或點開）才附文字 */
.lookb { pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgba(18, 14, 17, .62); border: 1px solid rgba(236, 227, 212, .35); border-radius: 50%; width: 58px; height: 58px; color: var(--paper); cursor: zoom-in; transition: width .2s ease, height .2s ease; }
.lookb svg { width: 32px; height: 32px; }
.lookb .lb { display: none; font-family: var(--display); font-size: 16px; line-height: 1; }
.lookb:hover, .lookb:focus-visible, .lookb[aria-expanded="true"] { width: 80px; height: 80px; }
.lookb:hover .lb, .lookb:focus-visible .lb, .lookb[aria-expanded="true"] .lb { display: block; }

/* 早上：桌上攤開的卡組，點一張放進妝匣 */
.spread { pointer-events: auto; position: absolute; left: 50%; top: 2px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(var(--cols, 4), auto); gap: 8px 10px; background: rgba(18, 14, 17, .72); border: 1px solid rgba(236, 227, 212, .22); padding: 10px 12px; max-height: 100%; overflow: auto; }
.spc { position: relative; width: var(--cw, 84px); height: var(--chh, 126px); border: none; background: none; padding: 0; cursor: pointer; transition: transform .15s ease; }
.spc img { width: 100%; height: 100%; display: block; border-radius: 6px; }
.spc:hover:not(:disabled), .spc:focus-visible { transform: translateY(-4px); }
.spc:disabled { cursor: default; filter: brightness(.42) saturate(.5); }
.spc .ct { position: absolute; right: -5px; top: -5px; min-width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ink); border: 1px solid var(--gold); font-size: 13px; font-variant-numeric: tabular-nums; }
.tools2 { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: center; }
.mini { border: 1px solid rgba(236, 227, 212, .45); background: transparent; color: var(--paper); font-size: 12px; padding: 3px 10px; min-height: 32px; cursor: pointer; }
.mini:disabled { opacity: .35; cursor: not-allowed; }
.yuan { pointer-events: auto; position: absolute; left: 50%; top: 2px; transform: translateX(-50%); width: min(620px, 100%); background: rgba(18, 14, 17, .78); border: 1px solid rgba(184, 145, 63, .6); padding: 10px 12px; }
.yuan h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 8px; text-align: center; }
.yuan .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.yn { border: 1px solid rgba(236, 227, 212, .45); background: transparent; color: var(--paper); text-align: left; padding: 8px 10px; cursor: pointer; font-family: var(--display); font-size: 20px; line-height: 1.3; }
.yn small { display: block; font-family: var(--body); font-size: 12px; color: var(--paper-2); }
.yn[aria-pressed="true"] { background: var(--red); border-color: var(--red); }

/* 紙：水牌、規矩 */
.panel { pointer-events: auto; position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: min(520px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--paper); color: var(--ink); padding: 14px 18px 16px; border-top: 6px solid var(--red); box-shadow: 0 12px 40px rgba(0, 0, 0, .55); }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 6px; letter-spacing: .08em; }
.panel h4 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 14px 0 4px; }
.panel .note { font-size: 13px; color: #5a5156; margin-top: 8px; }
.panel .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.panel ol, .panel ul { padding-left: 1.3em; margin: 0; font-size: 14px; }
.panel li + li { margin-top: 4px; }
.panel.rules { width: min(620px, 100%); }
.panel.shopp { width: min(700px, 100%); }
.board { list-style: none; padding: 0; margin: 4px 0 0; }
.board li { display: flex; justify-content: space-between; padding: 5px 2px; border-bottom: 1px solid #d3c7b4; font-size: 15px; font-variant-numeric: tabular-nums; }
.board li.me { color: var(--red); font-weight: 700; }
.board li.feng { color: #5a5156; }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.book > div { background: #e0d5c2; padding: 5px 6px; min-height: 58px; font-size: 12px; color: #5a5156; }
.cl { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.cl i { width: 16px; height: 20px; display: block; clip-path: polygon(0 0, 100% 0, 92% 100%, 50% 88%, 8% 100%); }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 4px 12px; background: #e0d5c2; padding: 8px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 8px 14px; cursor: pointer; min-height: 44px; }
.btn.go { background: var(--red); border-color: var(--red); color: var(--paper); }
.btn.small { min-height: 34px; padding: 3px 10px; font-size: 13px; }
.btn:focus-visible, .opt:focus-visible, .hc:focus-visible, .tool:focus-visible, .mini:focus-visible, .spc:focus-visible, .yn:focus-visible, .lookb:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* 字幕與選項 */
.talk { pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 4px 6px; }
.sub { max-width: min(46em, 100%); text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, .95), 0 0 2px #000; animation: rise .5s ease both; }
.sub .who { display: inline-block; font-size: 12px; letter-spacing: .3em; background: var(--red); color: var(--paper); padding: 1px 8px 0; margin-bottom: 4px; text-shadow: none; }
.sub .tx { font-family: var(--display); font-size: 24px; line-height: 1.5; }
.sub .gain { display: block; font-size: 14px; color: #e8cf8f; margin-top: 1px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.choices { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 22px; min-height: 44px; }
.opt { background: none; border: none; cursor: pointer; padding: 4px; min-height: 44px; text-align: left; font-family: var(--display); font-size: 24px; color: var(--paper); text-shadow: 0 2px 8px rgba(0, 0, 0, .95); position: relative; }
.opt::before { content: "—"; margin-right: 8px; color: var(--red-2); }
.opt small { font-family: var(--body); font-size: 12px; color: var(--paper-2); margin-left: 8px; }
.opt:hover::after, .opt:focus-visible::after { content: ""; position: absolute; left: 30px; right: 0; bottom: 4px; height: 3px; background: var(--red-2); border-radius: 2px; }
.opt:disabled { opacity: .35; cursor: not-allowed; }

/* 手牌：字要在這個大小就讀得清 */
.hand { pointer-events: auto; display: flex; justify-content: center; align-items: flex-end; overflow-x: auto; overflow-y: visible; padding: 16px 8px 2px; min-height: 0; scrollbar-width: none; }
.hand::-webkit-scrollbar { display: none; }
.hand.on { min-height: 178px; }
.hc { flex: none; border: none; background: none; padding: 0; width: 104px; height: 156px; margin: 0 -6px; position: relative; cursor: default; transition: transform .16s ease, filter .16s ease; transform-origin: 50% 120%; }
.hc img { width: 100%; height: 100%; display: block; border-radius: 7px; box-shadow: 0 6px 16px rgba(0, 0, 0, .6); }
.hc img, .spc img { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.hc.play { cursor: pointer; }
.hc.play:hover, .hc.play:focus-visible { transform: translateY(-14px) rotate(0deg) !important; z-index: 5; }
.hc.hot img { box-shadow: 0 0 0 3px #f2d48a, 0 0 22px rgba(242, 212, 138, .85); }
.hc.off { filter: brightness(.48) saturate(.5); }
/* 牌角一小塊紅：這張推出去會被染 */
.hc .stain { position: absolute; right: 0; top: 0; width: 34px; height: 34px; border-top-right-radius: 7px; background: linear-gradient(225deg, #c21f2c 0 48%, transparent 50%); }
.hand-label { pointer-events: none; text-align: center; font-size: 12px; letter-spacing: .2em; color: var(--paper-2); text-shadow: 0 1px 4px #000; min-height: 19px; }
.ghost { position: fixed; z-index: 40; pointer-events: none; border-radius: 7px; box-shadow: 0 10px 26px rgba(0, 0, 0, .6); }

/* 開場 */
.title { position: fixed; inset: 0; display: flex; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; background: linear-gradient(90deg, rgba(12, 9, 11, .88) 0%, rgba(12, 9, 11, .55) 55%, rgba(12, 9, 11, .1) 100%); overflow: auto; }
.title-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; max-width: 860px; margin-left: clamp(0px, 6vw, 80px); }
.vb { background: var(--red); color: var(--paper); font-family: var(--display); padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 4px var(--red); }
.vb .t { writing-mode: vertical-rl; font-size: 88px; line-height: 1; letter-spacing: .12em; }
.vb .s { writing-mode: vertical-rl; font-size: 15px; letter-spacing: .4em; }
.intro { font-family: var(--display); font-size: 25px; line-height: 1.75; max-width: 24em; }
.lede { margin-top: 10px; color: var(--paper-2); max-width: 38em; }
.form { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; }
.field label { display: block; font-size: 12px; letter-spacing: .2em; color: var(--paper-2); margin-bottom: 6px; }
.field input { font: inherit; font-size: 18px; padding: 7px 12px; border: 1px solid var(--paper-2); background: rgba(236, 227, 212, .08); color: var(--paper); width: 8em; }
.title .go { font-size: 17px; }
.title .hint { margin-top: 12px; font-size: 12px; color: var(--paper-2); }
.title .tg { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--paper-2); cursor: pointer; }
.title .tg input { width: 18px; height: 18px; accent-color: var(--red); }

/* 墨染轉場、更夫、印 */
#ink { position: fixed; inset: -10%; background: #0b0809; pointer-events: none; opacity: 0; clip-path: circle(0% at 50% 58%); filter: url(#rough); z-index: 30; }
#ink.on { opacity: 1; clip-path: circle(80% at 50% 58%); transition: clip-path .55s cubic-bezier(.6, 0, .4, 1); }
#ink.off { opacity: 0; transition: opacity .45s ease; clip-path: circle(80% at 50% 58%); }
.watch { position: fixed; inset: 0; z-index: 25; background: #070506; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px; padding: 24px; }
.watch .w { writing-mode: vertical-rl; font-family: var(--display); font-size: clamp(28px, 5.4vh, 42px); line-height: 1.5; letter-spacing: .14em; color: var(--paper); max-height: 62vh; animation: rise 1.2s ease both; }
.watch .w2 { color: var(--wash); font-size: 15px; letter-spacing: .2em; text-align: center; animation: rise 2s ease both; }
.watch .knock { font-size: 12px; letter-spacing: .5em; color: var(--wash); }
.watch .end { font-family: var(--display); font-size: clamp(44px, 9vh, 72px); color: var(--red-2); letter-spacing: .2em; }
.watch .sum { font-size: 13px; color: var(--wash); text-align: center; max-width: 34em; }
.watch .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.stamp { position: fixed; left: 50%; top: 34%; z-index: 35; transform: translate(-50%, -50%) rotate(-8deg); font-family: var(--display); font-size: 46px; color: var(--red-2); border: 5px solid var(--red-2); padding: 4px 22px; letter-spacing: .2em; pointer-events: none; animation: stampin .5s cubic-bezier(.2, 1.6, .4, 1) both; text-shadow: 0 0 12px rgba(0, 0, 0, .6); }
@keyframes stampin { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.2); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 1; } }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 32; }
.fleck { position: absolute; top: -14px; width: 10px; height: 8px; background: var(--gold); animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(560deg); opacity: .1; } }

/* 骰子 */
#dice { position: fixed; inset: 0; z-index: 36; display: flex; align-items: center; justify-content: center; pointer-events: none; }
#dice .dbox { background: rgba(18, 14, 17, .92); border: 1px solid var(--gold); padding: 16px 24px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, .6); min-width: 220px; max-width: calc(100vw - 32px); text-align: center; }
#dice .lb { font-size: 13px; letter-spacing: .12em; color: var(--paper-2); }
#dice .res { font-family: var(--display); font-size: 26px; min-height: 1.3em; }
#dice .res.ok { color: var(--gold); }
#dice .res.bad { color: var(--red-2); }
.die { display: inline-grid; width: 66px; height: 66px; background: #f4efe6; border-radius: 12px; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; box-shadow: inset 0 -4px 0 #c9bca6, 0 4px 14px rgba(0, 0, 0, .5); }

let audio = null, muted = false;
function wakeAudio() { try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) { audio = null; } }
function noise(dur, type, freq, gain) {
  const n = audio.createBuffer(1, Math.floor(audio.sampleRate * dur), audio.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain(), t = audio.currentTime;
  s.buffer = n; f.type = type; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(audio.destination); s.start();
}
function sfx(k) {
  if (!audio || muted) return;
  try {
    if (k === 'cheer') { noise(0.7, 'bandpass', 1500, 0.16); noise(0.45, 'bandpass', 900, 0.1); }
    if (k === 'boo') noise(0.9, 'lowpass', 340, 0.2);
    if (k === 'knock') [0, 0.42, 0.84].forEach(d => setTimeout(() => { if (!audio) return; const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime; o.type = 'triangle'; o.frequency.setValueAtTime(760, t); o.frequency.exponentialRampToValueAtTime(320, t + 0.09); g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14); o.connect(g); g.connect(audio.destination); o.start(); o.stop(t + 0.15); }, d * 1000));
    if (k === 'cloth') noise(0.25, 'highpass', 2400, 0.05);
  } catch (e) { /* 聲音出不來就算了 */ }
}

    say('', '她把饭留在桌上，灯又糊了一片。', '灯 +1');
    await wait(2200);
    if (t.forecast) { sayH('阿檀', foreTx(t.forecast), intelTag(t.forecast)); refresh(); await wait(4200); }
    view = 'watch'; showWatch();
    return;
  }
  if (t.emptySeat) {
    await ink(() => { view = 'night'; placeScene(); say('', ''); });
    say('', '对面的椅子空着。灯不再糊了。', t.layers.length ? '剩下的牌还能卸。' : '');
    return;
  }
  await ink(() => { view = 'evening'; lookOpen = false; placeScene(); say('', ''); });
  const nd = S.T.need;
  sayH('阿檀', LOOK_TX[nd.look] + (nd.items[1] ? `“${ALSO_TX[nd.items[1].look]}”` : ''), `今晚要 ${recipeShort(nd)}${S.T.dye ? ` · 前 ${S.T.dye} 张会被染` : ''}`);
});
const onHome = id => run(async () => {
  await fly(id, 'home');
  const r = playHome(S, id);
  if (!r) return;
  if (r.dyed) {
    wife?.react('down');
    const txt = r.blank ? '她翻过来看。背面什么也没有。' : HOME[r.h].hurt;
    say(`${r.name} · 被染`, txt, r.scar ? '灯上留了一道痕' : '这一道不算数');
  } else if (r.blank) {
    wife?.react('none');
    say('空白', '她翻过来看。背面什么也没有。', '灯不涨');
  } else {
    wife?.react(r.match ? 'up' : 'none');
    const nd = S.T.need, prog = `需要 ${gotOf(S.T)}/${nd.k}`;
    say(`${r.name}${r.match ? ' · 对路' : ''}`, r.match ? (r.gift ? '她认出这是她给你的，眼睛亮了一下。' : pick(['她抬眼看你，手上慢了一下。', '她笑了一下，把灯骨转过来给你看。'])) : '她接过去，点点头。可这不是她今晚要的。', `灯 +${r.gain} · ${prog}${r.count === 2 ? '（家常牌算两张）' : ''}`);
  }
  updateTable();
  if (S.T.pushed.length >= S.T.homeCap && S.T.homeCap === R.homeAfterWipe) { await wait(1500); say('', '她累了，只听得下这一张。'); }
});
const onEndEvening = () => run(async () => {
  endEvening(S);
  const t = S.T, look = t.need.look;
  // 先看她的需要：滿足了，或燈熄一截
  if (t.met) {
    wife?.react('up');
    sayH('阿檀', esc(MET_TX[look]), t.gift ? `<span class="itag">她送你一张家常牌「${T[t.gift].n}」：对上她的需要，一张算两张</span>` : '她今晚的需要，满足了');
  } else {
    wife?.react('down');
    sayH('', `${esc(OUT_TX[look])}灯${K('熄了一截')}。`, `没推够（${recipeShort(t.need)}）：灯 −${t.lampOut}${S.outs >= R.brokenOuts - 1 ? ` · 灯已经熄了 ${S.outs} 回` : ''}`);
  }
  updateTable();
  await wait(2600);
  await ink(() => { view = 'night'; placeScene(); say('', ''); });
  const base = t.layers.length ? `镜子里还有 ${t.layers.length} 层，睡一觉就渗进底色。` : '';
  // 一段的最後一晚：她說起往後兩天
  if (t.forecast) sayH('阿檀', foreTx(t.forecast), intelTag(t.forecast) + (base ? `<br>${esc(base)}` : ''));
  else say('', t.layers.length ? `夜里，${base}` : '夜里，镜子里的脸是干净的。');
});
const onLight = () => run(async () => {
  lightLamp(S);
  updateTable();
  if (glOK) focus('home', 'home');
  say('', S.scars >= R.seatScar ? '你一个人把灯点上了。' : '她把火递给你。你们一起把灯点上了。');
  await wait(2600);
  await ink(() => { view = 'night'; placeScene(); say('', ''); });
  say('', '外面的戏开锣了。你没有去。');
});
function showWatch() {
  const w = $('#watch'), l = S.T.watch || { tx: '', hint: '' }; w.hidden = false;
  sfx('knock');
  w.innerHTML = `<div class="knock">梆　梆　梆</div><div class="w">${esc(l.tx)}</div>${l.hint ? `<div class="w2">${esc(l.hint)}</div>` : ''}<button class="opt" data-act="dawn">天亮</button>`;
}
const onSleep = () => run(async () => {
  sleep(S);
  // 第二幕末：鏡子第一次映出底色
  if (S.day === 7 && glOK) {
    focus('mirror', 'night'); updateMirror();
    say('', S.base ? '你对着镜子卸完妆。镜子里，油彩底下还有一层颜色，擦不掉。' : '你对着镜子卸完妆。镜子里的脸，还是你的。');
    await wait(3400);
  }
  view = 'watch';
  showWatch();
});
const onDawn = () => run(async () => {
  $('#watch').hidden = true;
  dawn(S);
  if (S.phase === 'board') { view = 'board'; sheet = { k: 'board' }; placeScene(); say('', ''); return; }
  if (S.phase === 'lastwipe') { view = 'lastwipe'; placeScene(); say('', ''); showWipe(); return; }
  toDay();
});
const onNextAct = () => run(async () => { nextAct(S); toDay(); });
// ── 最後一層油彩：玩家親手卸 ──
function showWipe() {
  const el = $('#wipe'); el.hidden = false;
  const lastF = Object.keys(S.played).sort((a, b) => S.played[b] - S.played[a])[0];
  el.innerHTML = `<div class="face"><canvas id="clean" width="400" height="500"></canvas><canvas id="paint" width="400" height="500" aria-label="脸上最后一层油彩，拖动来卸掉"></canvas></div>
    <div class="tx">最后一层，你自己卸。</div><button class="opt" data-act="wipekey">卸一把<small>也可以直接在脸上拖</small></button>`;
  drawPortrait($('#clean'), { who: 'you', layers: [], base: S.base, bg: ['#8d9396', '#3b4044'] });
  const cv = $('#paint'), x = cv.getContext('2d');
  drawPortrait(cv, { who: 'you', layers: Array.from({ length: 6 }, () => ({ f: lastF })), base: S.base });
  x.globalCompositeOperation = 'destination-in'; x.beginPath(); x.ellipse(200, 275, 110, 141, 0, 0, Math.PI * 2); x.fill();
  x.globalCompositeOperation = 'destination-out';
  let down = false, last = null;
  const brush = (a, b) => { x.lineCap = 'round'; x.lineWidth = 62; x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); };
  const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', e => { down = true; last = at(e); cv.setPointerCapture(e.pointerId); brush(last, last); });
  cv.addEventListener('pointermove', e => { if (!down) return; const p = at(e); brush(last, p); last = p; });
  const up = () => { if (down) { down = false; checkWipe(); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  window.__wipeKey = () => { const r = rng(hash(String(Date.now()))); for (let i = 0; i < 3; i++) { const a = [110 + r() * 180, 150 + r() * 250]; brush(a, [a[0] + 90 - r() * 180, a[1] + 50 - r() * 100]); } checkWipe(); };
}
function checkWipe() {
  const cv = $('#paint'); if (!cv) return;
  const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
  let left = 0, all = 0;
  for (let y = 134; y < 416; y += 6) for (let X = 90; X < 310; X += 6) {
    if (((X - 200) / 110) ** 2 + ((y - 275) / 141) ** 2 > 1) continue;
    all += 1;
    if (d[(y * cv.width + X) * 4 + 3] > 40) left += 1;
  }
  if (left / all < 0.28) finishLast();
}
const finishLast = () => run(async () => {
  if (S.phase !== 'lastwipe') return;
  finishWipe(S);
  $('#wipe').hidden = true; $('#wipe').innerHTML = '';
  sfx('cloth');
  view = 'reveal'; sheet = { k: 'r_board' };
  S.T.layers = [];
  placeScene();
  say('', '');
});
function showFinal() {
  const e = endingOf(S), w = $('#watch'), kind = ['美满', '守住', '破裂'][wifeOf(S)];
  sheet = null; w.hidden = false; sfx('knock');
  w.innerHTML = `<div class="knock">梆　梆　梆</div><div class="w">${esc(S.name)}。</div><div class="w2" style="max-width:32em">${esc(ENDING_TX[e])}</div><div class="end">${e}</div>
    <div class="sum">卖座 ${S.gold} · 水牌第 ${rankOf(S)} · 妻子${kind} · 灯 ${S.lamp}（熄过 ${S.outs} 回）· 痕 ${S.scars} · 底色 ${S.base} · 满足 ${S.log.filter(x => x.met).length} 晚${S.choice ? ` · 元宵${{ stage: '上台', lamp: '回家点灯', cover: '替小凤代演' }[S.choice]}` : ''}</div>
    <div class="acts"><button class="btn go" data-act="again">再来一季</button><button class="btn" data-act="home">回到开场</button></div>`;
}

$('#title').addEventListener('input', e => { if (e.target.id === 'nm') draftName = e.target.value; });
document.addEventListener('click', e => {
  wakeAudio();
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, arg = b.dataset.arg, id = Number(arg);
  switch (a) {
    case 'start': setTutPref(!!$('#tutChk')?.checked); startGame((draftName.trim() || '小满').slice(0, 6)); return;
    case 'cont': continueGame(); return;
    case 'coachnext': coachNext(); break;
    case 'coachskip': coachSkip(); break;
    case 'rules': panel = panel === 'rules' ? null : 'rules'; break;
    case 'close': panel = null; break;
    case 'opt': S.opt[arg] = !S.opt[arg]; break;
    case 'mute': muted = !muted; break;
    case 'yuan': choose(S, arg); say('', { stage: '你把戏服抖开。', lamp: '你把戏服叠起来，放回箱子。', cover: '你接过小凤托人送来的头面。' }[arg]); break;
    case 'pick': { const c = S.deck.find(x => x.t === arg && !S.T.box.includes(x.id)); if (c) { if (S.T.box.length >= S.T.cap) S.T.box.pop(); toggleBox(S, c.id); } break; }
    case 'yesterday': boxYesterday(S); break;
    case 'shop': panel = 'shop'; break;
    case 'water': panel = panel === 'water' ? null : 'water'; break;
    case 'buy': { const c = buy(S, arg); if (c) { sfx('cheer'); if (c.relic) say('孙师父', `“${RELICS[arg].n}，你留着。”`, `钱袋 −${RELICS[arg].price}：${RELICS[arg].tx}`); else say('孙师父', `“「${T[arg].n}」，拿去。”`, `钱袋 −${T[arg].price}，这张进了卡组`); } break; }
    case 'clear': clearBox(S); break;
    case 'depart': onDepart(); return;
    case 'endstage': onEndStage(); return;
    case 'todoor': onToDoor(); return;
    case 'wipe': onWipe(); return;
    case 'enter': onEnter(); return;
    case 'look': lookOpen = !lookOpen; break;
    case 'endeve': onEndEvening(); return;
    case 'light': onLight(); return;
    case 'sleep': onSleep(); return;
    case 'dawn': onDawn(); return;
    case 'nextact': onNextAct(); return;
    case 'wipekey': window.__wipeKey?.(); return;
    case 'rstep': sheet = { k: arg }; if (arg === 'r_home') { focus('home', 'home'); } if (arg === 'r_chest') focus('table', 'home'); break;
    case 'rfinal': showFinal(); break;
    case 'again': $('#watch').hidden = true; startGame(S.name); return;
    case 'home': $('#watch').hidden = true; saved = load(); S = null; view = 'title'; sheet = null; panel = null; coach.lesson = null; clearBubs(); if (glOK) focus('table', 'night'); refresh(); return;
    case 'card':
      if (view === 'morning') { toggleBox(S, id); break; }
      if (view === 'stage') { onStage(id); return; }
      if (view === 'evening') { onHome(id); return; }
      if (view === 'door' || view === 'night') { onClean(id); return; }
      break;
  }
  refresh();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel) { panel = null; refresh(); } });

// 測試用：在主控台裡看規則與流程
window.__dise = { R, T, newGame, endingOf, boardOf, get S() { return S; }, get view() { return view; } };

(async function boot() {
  const glyphs = Object.values(T).map(t => t.n).join('') + Object.values(HOME).map(h => h.n + h.look).join('') + '底色戏城金接背面空白借灯唱念做打起手第天';
  try { await Promise.race([Promise.all([document.fonts.load('40px "Ma Shan Zheng"', glyphs), document.fonts.load('16px "Noto Serif SC"', glyphs)]), wait(3500)]); } catch (e) { /* 字體載不到就用後備字體 */ }
  initGL();
  saved = load();
  if (glOK) {
    focus('table', 'night');
    wife.base = 'work'; wife.pose('work'); wife.root.position.set(0, -0.32, SEAT_Z[0]); stool.position.set(0, 0, SEAT_Z[0] - 0.02);
    actor.root.visible = false;
    drawPortrait(mirrorCv, { who: 'you', layers: [], bg: ['#8d9396', '#3b4044'] }); mirrorTex.needsUpdate = true;
  }
  refresh();
})();
</script>
