<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>底色·戏城 v0.5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* 版面：全螢幕 3D 場景墊底，紙、印、手牌、字幕用 2D 浮在上面。淡墨灰、墨黑、朱紅三色，刻意只做一種暗色舞台。 */
:root {
  color-scheme: dark;
  --ink: #120e11;      /* 夜與墨 */
  --ink-2: #2a2226;
  --paper: #ece3d4;    /* 宣紙 */
  --paper-2: #d6cab6;
  --wash: #8d8487;     /* 淡墨 */
  --red: #a8202b;      /* 朱紅 */
  --red-2: #d8434c;
  --gold: #b8913f;
  --text: #f1e9dc;
  --display: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.6; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
p { margin: 0; }
#gl, #smear, #vig, #grain { position: fixed; inset: 0; width: 100%; height: 100%; }
#gl { display: block; }
#smear, #vig, #grain { pointer-events: none; }
#vig { background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(8, 6, 7, .78) 100%); }
#grain { opacity: .2; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 1 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"); }

/* 浮層 */
.hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding-block: max(12px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
.seal { pointer-events: auto; background: var(--red); color: var(--paper); font-family: var(--display); font-size: 30px; line-height: 1; padding: 8px 9px 6px; box-shadow: 0 0 0 2px var(--ink), 0 0 0 3px var(--red); }
.when { line-height: 1.25; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.when b { font-family: var(--display); font-weight: 400; font-size: 22px; display: block; }
.when span { font-size: 12px; letter-spacing: .15em; color: var(--paper-2); }
.stats { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 14px; font-size: 13px; color: var(--paper-2); text-shadow: 0 1px 6px rgba(0, 0, 0, .9); }
.stats b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
.portrait { width: 64px; height: 80px; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .7)); }
.tools { display: flex; gap: 6px; }
.tool { white-space: nowrap; background: rgba(18, 14, 17, .6); border: 1px solid rgba(236, 227, 212, .35); color: var(--paper); padding: 3px 10px; font-size: 12px; cursor: pointer; min-height: 30px; }
.tool[aria-pressed="true"] { background: var(--paper); color: var(--ink); }

.mid { flex: 1; min-height: 0; position: relative; }
.stagebar { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: none; }
.seg { background: rgba(18, 14, 17, .72); border: 1px solid rgba(236, 227, 212, .2); padding: 6px 10px 7px; min-width: 96px; text-align: center; }
.seg.cur { border-color: var(--gold); box-shadow: 0 0 18px rgba(216, 67, 76, .45); }
.seg b { font-family: var(--display); font-weight: 400; font-size: 20px; }
.seg small { display: block; font-size: 11px; color: var(--paper-2); }
.seg .pips { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
.seg .pips i { width: 10px; height: 14px; border: 1px dashed rgba(236, 227, 212, .4); }
.seg .pips i.on { border: none; }
.seg .pips i.bad { outline: 1px solid var(--paper); outline-offset: -1px; }
.goldnow { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); font-size: 13px; color: var(--paper-2); text-shadow: 0 1px 6px #000; white-space: nowrap; }
.goldnow b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); }

/* 紙：早上的妝匣、帳 */
.panel { pointer-events: auto; position: absolute; left: 0; top: 8px; bottom: 8px; width: min(430px, 100%); overflow: auto; background: var(--paper); color: var(--ink); padding: 16px 18px 18px; border-top: 6px solid var(--red); box-shadow: 0 12px 40px rgba(0, 0, 0, .55); }
.panel h3 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 6px; letter-spacing: .08em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel h3 small { font-family: var(--body); font-size: 12px; color: #5a5156; letter-spacing: 0; }
.panel .hint { font-size: 12px; color: #5a5156; margin-top: 6px; }
.panel section + section { margin-top: 16px; }
.slips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slip { position: relative; border: none; background: var(--red); color: var(--paper); padding: 10px 10px 12px; cursor: pointer; text-align: left; min-height: 150px; display: flex; gap: 10px; align-items: stretch; box-shadow: inset 0 0 0 2px var(--red), inset 0 0 0 3px rgba(236, 227, 212, .6); }
.slip[aria-pressed="false"] { opacity: .55; filter: saturate(.6); }
.slip[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.slip .vt { writing-mode: vertical-rl; font-family: var(--display); font-size: 30px; line-height: 1; letter-spacing: .1em; }
.slip .sg { display: flex; flex-direction: column; gap: 5px; font-size: 13px; justify-content: center; }
.slip .sg span { display: flex; align-items: center; gap: 6px; }
.slip .sg i { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--display); font-size: 15px; border: 1px solid var(--paper); }
.slip .tag { position: absolute; right: 8px; bottom: 6px; font-size: 11px; opacity: .85; }
.meter { display: flex; flex-wrap: wrap; gap: 3px; margin: 2px 0 8px; }
.meter i { width: 15px; height: 21px; border: 1px dashed #8b7f84; }
.meter i.on { border: none; }
.deck { display: flex; flex-direction: column; gap: 6px; }
.dk { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px solid #d3c7b4; }
.dk img { width: 44px; height: 66px; display: block; border-radius: 4px; }
.dk .nm { min-width: 0; line-height: 1.3; }
.dk .nm b { font-family: var(--display); font-weight: 400; font-size: 19px; }
.dk .nm small { display: block; font-size: 11px; color: #5a5156; }
.dk .ct { display: flex; align-items: center; gap: 4px; }
.dk .ct span { min-width: 2.8em; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.step { width: 34px; height: 34px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 18px; line-height: 1; }
.step:disabled { opacity: .3; cursor: not-allowed; }
.btn { border: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 8px 14px; cursor: pointer; min-height: 44px; }
.btn.go { background: var(--red); border-color: var(--red); color: var(--paper); }
.btn:focus-visible, .step:focus-visible, .slip:focus-visible, .opt:focus-visible, .hc:focus-visible, .tool:focus-visible, .pick:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* 字幕與選項 */
.talk { pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 4px 10px; }
.sub { max-width: min(46em, 100%); text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, .95), 0 0 2px #000; animation: rise .6s ease both; }
.sub .who { display: inline-block; font-size: 12px; letter-spacing: .3em; background: var(--red); color: var(--paper); padding: 1px 8px 0; margin-bottom: 6px; text-shadow: none; }
.sub .tx { font-family: var(--display); font-size: 25px; line-height: 1.55; }
.sub .gain { display: block; font-size: 14px; color: var(--gold); margin-top: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.choices { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; }
.opt { background: none; border: none; cursor: pointer; padding: 6px 4px; min-height: 44px; text-align: left; font-family: var(--display); font-size: 24px; color: var(--paper); text-shadow: 0 2px 8px rgba(0, 0, 0, .95); position: relative; }
.opt::before { content: "—"; margin-right: 8px; color: var(--red-2); }
.opt small { font-family: var(--body); font-size: 12px; color: var(--paper-2); margin-left: 8px; }
.opt:hover::after, .opt:focus-visible::after { content: ""; position: absolute; left: 30px; right: 0; bottom: 6px; height: 3px; background: var(--red-2); border-radius: 2px; }
.opt:disabled { opacity: .35; cursor: not-allowed; }

/* 手牌 */
.hand { pointer-events: auto; display: flex; justify-content: center; align-items: flex-end; overflow-x: auto; overflow-y: visible; padding: 18px 8px 4px; min-height: 0; scrollbar-width: none; }
.hand.on { min-height: 160px; }
.hand::-webkit-scrollbar { display: none; }
.hc { flex: none; border: none; background: none; padding: 0; width: 92px; height: 138px; margin: 0 -10px; position: relative; cursor: default; transition: transform .18s ease, filter .18s ease; transform-origin: 50% 120%; }
.hc img { width: 100%; height: 100%; display: block; border-radius: 7px; box-shadow: 0 6px 16px rgba(0, 0, 0, .6); }
.hc.play { cursor: pointer; }
.hc.play img { box-shadow: 0 0 0 2px var(--gold), 0 8px 22px rgba(216, 67, 76, .45); }
.hc.play:hover, .hc.play:focus-visible { transform: translateY(-16px) rotate(0deg) !important; z-index: 5; }
.hc.off { filter: brightness(.45) saturate(.5); }
.hc .st { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; color: var(--paper); background: rgba(18, 14, 17, .55); border-radius: 7px; letter-spacing: .1em; }
.hand-label { pointer-events: none; text-align: center; font-size: 12px; letter-spacing: .2em; color: var(--paper-2); text-shadow: 0 1px 4px #000; margin-top: 2px; }
.ghost { position: fixed; z-index: 40; pointer-events: none; border-radius: 7px; box-shadow: 0 10px 26px rgba(0, 0, 0, .6); }

/* 開場 */
.title { position: fixed; inset: 0; display: flex; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; background: linear-gradient(90deg, rgba(12, 9, 11, .88) 0%, rgba(12, 9, 11, .55) 55%, rgba(12, 9, 11, .1) 100%); overflow: auto; }
.title-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; max-width: 860px; margin-left: clamp(0px, 6vw, 80px); }
.vb { background: var(--red); color: var(--paper); font-family: var(--display); padding: 26px 18px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 4px var(--red); }
.vb .t { writing-mode: vertical-rl; font-size: 88px; line-height: 1; letter-spacing: .12em; }
.vb .s { writing-mode: vertical-rl; font-size: 15px; letter-spacing: .4em; }
.intro { font-family: var(--display); font-size: 25px; line-height: 1.75; max-width: 24em; }
.lede { margin-top: 10px; color: var(--paper-2); max-width: 38em; }
.form { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; }
.field label { display: block; font-size: 12px; letter-spacing: .2em; color: var(--paper-2); margin-bottom: 6px; }
.field input { font: inherit; font-size: 18px; padding: 7px 12px; border: 1px solid var(--paper-2); background: rgba(236, 227, 212, .08); color: var(--paper); width: 8em; }
.picks { display: flex; gap: 6px; }
.pick { border: 1px solid var(--paper-2); background: transparent; color: var(--paper); font-family: var(--display); font-size: 22px; min-width: 48px; min-height: 44px; cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.title .go { font-size: 17px; }
.title .hint { margin-top: 12px; font-size: 12px; color: var(--paper-2); }

/* 墨染轉場、更夫、印 */
#ink { position: fixed; inset: -10%; background: #0b0809; pointer-events: none; opacity: 0; clip-path: circle(0% at 50% 58%); filter: url(#rough); z-index: 30; }
#ink.on { opacity: 1; clip-path: circle(80% at 50% 58%); transition: clip-path .65s cubic-bezier(.6, 0, .4, 1); }
#ink.off { opacity: 0; transition: opacity .55s ease; clip-path: circle(80% at 50% 58%); }
.watch { position: fixed; inset: 0; z-index: 25; background: #070506; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 28px; padding: 24px; }
.watch .w { writing-mode: vertical-rl; font-family: var(--display); font-size: clamp(30px, 6vh, 46px); line-height: 1.5; letter-spacing: .14em; color: var(--paper); max-height: 70vh; animation: rise 1.4s ease both; }
.watch .knock { font-size: 12px; letter-spacing: .5em; color: var(--wash); }
.stamp { position: fixed; left: 50%; top: 38%; z-index: 35; transform: translate(-50%, -50%) rotate(-8deg); font-family: var(--display); font-size: 46px; color: var(--red-2); border: 5px solid var(--red-2); padding: 4px 22px; letter-spacing: .2em; pointer-events: none; animation: stampin .5s cubic-bezier(.2, 1.6, .4, 1) both; text-shadow: 0 0 12px rgba(0, 0, 0, .6); }
@keyframes stampin { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.2); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 1; } }
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 32; }
.fleck { position: absolute; top: -14px; width: 10px; height: 8px; background: var(--gold); animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(560deg); opacity: .1; } }

/* 帳 */
.ledger h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 4px; letter-spacing: .1em; }
.ledger .rowx { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 4px 12px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #d3c7b4; }
.ledger .rowx b { font-variant-numeric: tabular-nums; }
.ledger .cl { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.ledger .cl i { width: 18px; height: 22px; display: block; clip-path: polygon(0 0, 100% 0, 92% 100%, 50% 88%, 8% 100%); }
.ledger .w { font-family: var(--display); font-size: 21px; margin-top: 10px; }
.ledger .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.rules ol { padding-left: 1.3em; margin: 0; font-size: 14px; }
.rules li + li { margin-top: 5px; }

@media (prefers-reduced-motion: reduce) {
  .fleck { display: none; }
  .sub, .watch .w, .stamp { animation: none; }
  #ink.on { transition-duration: .01s; }
}
@media (max-width: 760px) {
  .hc { width: 66px; height: 99px; margin: 0 -7px; }
  .hand.on { min-height: 121px; }
  .panel { top: auto; bottom: 0; height: 58%; width: 100%; padding: 12px 14px 14px; }
  .sub .tx { font-size: 20px; }
  .opt { font-size: 21px; }
  .stats { font-size: 11px; gap: 2px 10px; }
  .stats b { font-size: 18px; }
  .seal { font-size: 24px; }
  .when b { font-size: 16px; white-space: nowrap; }
  .when span { display: none; }
  .top { gap: 8px; }
  .panel { height: 52%; }
  .seg { min-width: 70px; padding: 4px 6px; }
  .seg b { font-size: 16px; }
  .goldnow { top: 70px; }
  .portrait { width: 48px; height: 60px; }
  .title-in { grid-template-columns: minmax(0, 1fr); gap: 18px; margin-left: 0; }
  .vb { flex-direction: row; justify-content: center; padding: 14px; }
  .vb .t { writing-mode: horizontal-tb; font-size: 54px; }
  .vb .s { writing-mode: horizontal-tb; letter-spacing: .2em; }
  .intro { font-size: 20px; }
  .title { align-items: flex-start; background: rgba(12, 9, 11, .8); }
}
/* v0.5：狀態圖示、配合提示、她的樣子、骰子、結算紙 */
.staterow { display: flex; justify-content: flex-end; pointer-events: none; margin-top: 6px; }
.state { pointer-events: auto; display: flex; flex-direction: column; gap: 3px; background: rgba(18, 14, 17, .66); border: 1px solid rgba(236, 227, 212, .22); padding: 5px 9px; font-size: 12px; color: var(--paper-2); }
.state .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.state .who { font-size: 11px; letter-spacing: .2em; color: var(--paper-2); width: 1.4em; }
.state .gap { width: 4px; }
.st-i { display: inline-flex; align-items: center; gap: 3px; color: var(--paper); }
.st-i svg { width: 16px; height: 16px; flex: none; }
.st-i b { font-weight: 400; font-variant-numeric: tabular-nums; }
.st-i .pp { display: inline-flex; gap: 2px; }
.st-i .pp i { width: 5px; height: 10px; border: 1px solid rgba(236, 227, 212, .45); }
.st-i .pp i.on { background: var(--paper); border-color: var(--paper); }
.st-i.warn { color: var(--red-2); }
.st-i.warn .pp i.on { background: var(--red-2); border-color: var(--red-2); }
.state .broke { align-self: flex-end; font-family: var(--display); font-size: 16px; color: var(--paper); background: var(--red); padding: 0 8px; letter-spacing: .2em; }
.seg.ok b::after { content: " ✓"; color: var(--gold); font-family: var(--body); font-size: 13px; }
.goldnow { text-align: center; background: rgba(18, 14, 17, .6); padding: 4px 12px 6px; }
.panel.sheet h2 { font-size: 28px; }
.panel.sheet .rowx { padding: 5px 0; }
.goldnow .combos { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 4px; white-space: normal; }
.goldnow .cb { background: var(--gold); color: var(--ink); padding: 1px 8px; font-family: var(--display); font-size: 16px; }
.goldnow .tip { border: 1px dashed rgba(236, 227, 212, .5); padding: 1px 8px; font-size: 12px; }
.goldnow .none { font-size: 12px; opacity: .7; }
.lookb { pointer-events: auto; position: absolute; left: 0; top: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: rgba(18, 14, 17, .6); border: 1px solid rgba(236, 227, 212, .3); border-radius: 50%; width: 64px; height: 64px; justify-content: center; color: var(--paper); cursor: zoom-in; transition: transform .2s ease, width .2s ease, height .2s ease; }
.lookb svg { width: 34px; height: 34px; }
.lookb .lb { display: none; font-family: var(--display); font-size: 16px; line-height: 1; }
.lookb:hover, .lookb:focus-visible, .lookb[aria-expanded="true"] { width: 84px; height: 84px; }
.lookb:hover .lb, .lookb:focus-visible .lb, .lookb[aria-expanded="true"] .lb { display: block; }
.panel h4 { font-family: var(--display); font-weight: 400; font-size: 19px; margin: 14px 0 4px; }
.rules ul { padding-left: 1.2em; margin: 0; font-size: 13px; color: #3c3438; }
.rules ul li + li { margin-top: 4px; }
.panel .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn small { display: block; font-size: 11px; color: inherit; opacity: .75; }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.mini { border: 1px solid #8b7f84; background: transparent; color: var(--ink); font-size: 12px; padding: 3px 8px; min-height: 30px; cursor: pointer; }
.mini[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mini:disabled { opacity: .35; cursor: not-allowed; }
.tools2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.special .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.special .btn { text-align: left; }
.dk .nm em { font-style: normal; font-size: 11px; background: var(--red); color: var(--paper); padding: 0 5px; margin-left: 6px; vertical-align: 3px; }
.meter i.home { outline: 1px solid #8b7f84; outline-offset: -1px; }
.mini:focus-visible, .lookb:focus-visible, .btn.small:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#dice { position: fixed; inset: 0; z-index: 36; display: flex; align-items: center; justify-content: center; pointer-events: none; }

  else { left = a.right + 14; top = a.top + a.height / 2 - ph / 2; if (left + pw > W - 16) { left = a.left + a.width / 2 - pw / 2; top = a.top - 12 - ph; } }
  p.style.left = `${clamp(left, 16, Math.max(16, W - pw - 16))}px`;
  p.style.top = `${clamp(top, 8, Math.max(8, H - ph - 8))}px`;
}
function hidePeek() { peekAt = null; $('#peek').hidden = true; }
const peekEl = x => x?.closest?.('.hc, .dk img[data-t]');
// 手牌每次重畫，舊的牌就換成新元素：滑鼠還停在牌上的話，換到新元素上接著看
function peekSync() {
  if (!peekAt || peekAt.isConnected) return;
  hidePeek();
  const el = !busy && peekXY ? peekEl(document.elementFromPoint(...peekXY)) : null;
  if (el) showPeek(el);
}
document.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') peekXY = [e.clientX, e.clientY]; }, { passive: true });
document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = peekEl(e.target); if (el && el !== peekAt) showPeek(el); });
document.addEventListener('pointerout', e => { const el = peekEl(e.target); if (el && el === peekAt && !el.contains(e.relatedTarget)) hidePeek(); });
document.addEventListener('focusin', e => { const el = e.target.closest?.('.hc'); if (el) showPeek(el); });
document.addEventListener('focusout', e => { if (e.target === peekAt) hidePeek(); });
// 手機：長按看牌，放開時不出牌
document.addEventListener('pointerdown', e => {
  peekEat = false;
  if (e.pointerType !== 'touch') return;
  const el = peekEl(e.target);
  if (!el) return;
  clearTimeout(peekHold);
  peekHold = setTimeout(() => { showPeek(el); peekEat = true; }, 380);
});
['pointerup', 'pointercancel'].forEach(k => document.addEventListener(k, e => { if (e.pointerType !== 'touch') return; clearTimeout(peekHold); if (peekAt) setTimeout(hidePeek, 0); }));
document.addEventListener('click', e => { if (peekEat) { peekEat = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', e => { if (peekEl(e.target)) e.preventDefault(); });

// ── 一天 ──
// 依目前時段擺 3D 場景（開局、接著玩都走這裡）
function placeScene() {
  clear3DCards();
  if (view === 'morning') { setScene('dress', 'day'); setBoxStack(S.T.box.length); }
  else if (view === 'stage') { setScene('stage'); actor?.setLayers(S.T.layers); }
  else if (view === 'door') { setScene('door'); doorStage(); }
  else if (view === 'evening') { setScene('home'); if (glOK) placeWife('home', V(0, -0.52, -0.5), LOOK_POSE[S.T.look]); }
  else if (view === 'end') endScene();
  else setScene('dress', view === 'week' ? 'dawn' : 'night');
  updateMirror(0); updateRope(); updateLamp();
}
function endScene() {
  if (!glOK) return;
  const e = endingOf(S);
  if (e === 'toupai') { setScene('stage'); actor?.setLayers([{ f: 'sing' }, { f: 'fight' }]); actor?.pose('bow'); return; }
  if (e === 'gengfu') { setScene('door'); sets.door.g.userData.leaf.rotation.y = 0; return; }
  setScene('home'); placeWife('home', V(0, -0.52, -0.5), 'seat'); wife.react('up'); updateLamp();
}
function toMorning() {
  view = 'morning'; mode = null; sheet = null; editDeck = false; lookOpen = false;
  if (glOK) { wife.root.visible = false; actor.setLayers([]); }
  placeScene();
  const tx = MORNING[S.day] || MORNING_ROT[S.day % MORNING_ROT.length];
  say('', tx, S.day === 1 ? tip('morning') : S.T.notes.join(''));
  refresh();
}
function startGame(name) {
  S = newGame(name, ((Date.now() % 2147483647) ^ Math.floor(Math.random() * 2147483647)) >>> 0);
  S.tut = { off: !tutPref(), seen: {} };
  coach.lesson = null;
  saved = null; panel = null;
  toMorning();
}
function continueGame() {
  S = saved; saved = null; panel = null; mode = null; lookOpen = false;
  S.tut = S.tut || { off: true, seen: {} };
  coach.lesson = null;
  view = S.phase; sheet = view === 'week' ? { k: 'week' } : view === 'end' ? { k: 'end' } : null;
  placeScene();
  if (view === 'watch') showWatch();
  say('', `第 ${S.day} 天，接着来。`);
  refresh();
}
const onDepart = () => run(async () => {
  depart(S);
  const sc = scriptNow(S);
  await ink(() => { view = 'stage'; placeScene(); actor?.setLayers([]); actor?.pose('idle'); });
  say('班主', `今天唱《${sc.n}》。${SEG_N[0]}段要${FAM[sc.segs[0]].n}。`, tip('stage'));
});
const onStage = id => run(async () => {
  const f = fOf(S, id), want = scriptNow(S).segs[S.T.seg], name = tOf(S, id).n;
  await fly(id, 'stage');
  playStage(S, id);
  const p = S.T.plays[S.T.plays.length - 1], fresh = combosNow(S).find(c => c.at.includes(S.T.plays.length - 1));
  actor?.perform(f); actor?.setLayers(S.T.layers);
  const tx = f === want ? pick(['台下有人叫好。', '这一句唱得满，金箔落下来几片。', '班主在侧幕点了点头。']) : '台下静了一下。这一段要的不是它。';
  say('', tx, [p.sig ? `招牌「${name}」：金 +${p.sig}` : '', fresh ? `成了${COMBO_N[fresh.k]}，收场时掷骰` : ''].filter(Boolean).join('　'));
});
const onEndStage = () => run(async () => {
  endStage(S);
  const t = S.T;
  for (const c of t.combos) await showDice({ label: `${COMBO_N[c.k]} · ${c.fams.map(f => FAM[f].n).join('→')}`, v: c.die, mod: c.mod, ok: c.ok, result: c.big ? `大成功 +${c.gold}` : c.ok ? `成了 +${c.gold}` : '落空' });
  if (t.gold) { burst(t.gold * 2); goldRain(); }
  if (t.perfect) stamp('完美');
  actor?.pose('bow');
  sheet = { k: 'combo' };
  say('班主', t.perfect ? `好！${t.gold} 金箔。` : t.gold ? `散戏。${t.gold} 金箔。` : '今天你没有上台。');
});
const onToDoor = () => run(async () => {
  sheet = null;
  await ink(() => { view = 'door'; mode = null; placeScene(); say('', ''); });
  const good = moodGood(S);
  await showDice({ label: '心情骰 · 3 以上心情好', v: S.T.mood, ok: good, result: good ? '心情好' : '心情差' });
  const [who, tx] = DOOR_SAY[S.T.door];
  say(who, tx, S.day === 1 && tip('door') ? tip('door') : S.T.door === 'absent' ? '安心不到 2，她没有出来。' : '');
});
function doorStage() {
  if (!glOK) return;
  const d = S.T.door, leaf = sets.door.g.userData.leaf;
  leaf.rotation.y = d === 'locked' ? 0 : 1.15;
  if (d === 'wipe' || d === 'unwilling') placeWife('door', V(0, 0, 0.32), 'idle');
  if (d === 'unwilling') setTimeout(() => { wife.turn(2.6); walkWife(-0.5, 1200); }, 1300);
}
const onWipe = () => run(async () => {
  if (!canWipe(S)) return;
  const n = Math.min(R.wipeMax, S.T.layers.length), cols = S.T.layers.slice(-n).reverse().map(l => FCOL[l.f]);
  if (glOK) { await walkWife(1.95, 800); wife.pose('reach'); await wait(250); }
  for (const c of cols) await towelSwipe(c);
  wipe(S); renderSmear();
  say('阿檀', n === 2 ? '她踮起脚，替你擦掉两层，把毛巾叠起来收进袖子里。' : '她踮起脚，替你擦掉一层。毛巾上染了颜色。', `安心 −1　${S.T.layers.length ? `还剩 ${S.T.layers.length} 层` : '脸上干净了'}`);
  if (glOK) { await wait(400); wife.pose('idle'); await walkWife(0.32, 800); }
});
const restTx = () => (S.T.layers.length ? `还剩 ${S.T.layers.length} 层。` : '脸上干净了。');
const onSelf = () => run(async () => {
  if (!topLayer(S)) return;
  if (canRoll(S)) {
    const d = selfRoll(S);
    await showDice({ label: `自卸 · ${FAM[d.f].n}层 · 抹淡线 ${d.need}${d.need < 6 ? '–6' : ''}`, v: d.v, ok: d.ok, result: d.ok ? '抹淡了' : '没抹淡' });
    if (d.ok) {
      renderSmear();
      if (view === 'night') { updateMirror(0); updateRope(); }
      say('', `这层${FAM[d.f].n}抹淡了，布挂上晾绳。${restTx()}`);
      return;
    }
  }
  mode = 'cloth';
  say('', '没抹淡。挑一张牌弃掉，当布卸掉这层；或者留着它。');
});
const onClean = id => run(async () => {
  const name = tOf(S, id).n;
  await fly(id, 'cloth');
  selfClean(S, id); mode = null; renderSmear();
  if (view === 'night') { updateMirror(0); updateRope(); }
  say('', `「${name}」成了一块布，挂上晾绳。${restTx()}`);
});
const onEnter = () => run(async () => {
  enterHome(S);
  const t = S.T;
  await ink(() => { view = 'evening'; mode = null; lookOpen = false; placeScene(); });
  if (t.residual) { say('', ...RES_SAY[t.residual]); await wait(2000); }
  if (t.bday) { say('陪生日', t.reacts[0].tx, '被看见 +1'); await wait(2000); }
  say('', LOOK_TX[t.look], tip('evening'));
});
function gainOf(r) {
  if (r.dup) return `同族一晚一次：只占位${r.pen ? ' · 唱的残留：安心 −1' : ''}`;
  if (!r.valid) return `念的残留：倾听无效${r.pen ? ' · 唱的残留：安心 −1' : ''}`;
  const d = r.d, parts = [r.match ? '对路' : ''];
  [['calm', '安心'], ['seen', '被看见'], ['rift', '裂痕'], ['lamp', '灯'], ['hand', '手伤']].forEach(([k, n]) => { if (d[k]) parts.push(`${n} ${sign(d[k])}`); });
  if (r.pen) parts.push('（含唱的残留 −1）');
  if (r.f === 'gift') parts.push(`金箔 −${R.giftCost}`);
  return parts.filter(Boolean).join(' · ');
}
function needMoment(h) {
  wife?.react('up');
  const done = S.needDone.filter(Boolean).length;
  say('阿檀', NEED_TX[h.w], `心愿 ${done}/4${h.card ? ` · 你多了一张牌：「${h.card}」` : ''}${h.w === 1 || h.w === 2 ? ' · 灯 +1' : ''}`);
  updateLamp();
}
const onHome = id => run(async () => {
  await fly(id, 'home');
  playHome(S, id);
  const r = S.T.reacts[S.T.reacts.length - 1];
  if (r.eyeDie) await showDice({ label: '心情差 · 抬眼要 4 以上', v: r.eyeDie.v, ok: r.eye, result: r.eye ? '她抬眼了' : '她没抬眼' });
  wife?.react(r.k);
  updateLamp();
  say(`${r.who} · ${r.k === 'up' ? '抬眼' : r.k === 'down' ? '低头' : '没抬眼'}`, r.tx, gainOf(r));
  if (r.hit) { await wait(2000); needMoment(r.hit); }
});
const onEndEvening = () => run(async () => {
  if (trayDue(S)) {
    mode = 'tray';
    wife?.pose('reach');
    say('阿檀', '她撑着桌子站起来，端起一摞碗盘，手有点抖。', '接过来，还是不接？');
    return;
  }
  await finishEvening();
});
const onTray = accept => run(async () => {
  const need = S.hand + 1;
  tray(S, accept);
  mode = null;
  const tr = S.T.tray;
  if (tr.accept) {
    await showDice({ label: `端盘 · 掷到 ${need} 以下会失手`, v: tr.v, ok: !tr.fail, result: tr.fail ? '失手' : '端稳了' });
    say(tr.fail ? '' : '阿檀', tr.fail ? '盘子从你手里滑下去，碎了一地。她蹲下去捡，割破了手。' : '你接过盘子，稳稳端进灶间。', tr.fail ? '伤 +1 · 安心 −2 · 裂痕 +1' : '安心 +1');
    wife?.react(tr.fail ? 'down' : 'up');
  } else { say('', '你没有接。她自己端进去了。', '安心 −1'); wife?.react('down'); }
  await wait(2000);
  await finishEvening();
});
async function finishEvening() {
  endEvening(S);
  const t = S.T;
  if (t.cold) { say('', '她说了一半，看你没在听，就不说了。', '伤 +1 · 安心 −1'); await wait(2000); }
  if (t.empty) { say('', '今晚，你一张家中牌都没有出。她把饭收了。', '空宅 · 安心 −1'); await wait(2000); }
  const h3 = t.needHits.find(h => h.w === 3);
  if (h3) { needMoment(h3); await wait(2400); }
  await ink(() => { view = 'night'; mode = null; placeScene(); if (S.day === R.mirrorDay) sheet = { k: 'mirror' }; });
  if (S.day === R.mirrorDay && glOK) updateMirror(S.base);
  say('', t.layers.length ? `夜里，镜子里的脸上还有 ${t.layers.length} 层台上脸。没卸掉的，睡一觉就渗进底色里。` : '夜里，镜子里的脸是干净的。', tip('night'));
}
function showWatch() {
  const w = $('#watch'); w.hidden = false;
  w.innerHTML = `<div class="knock">梆　梆　梆</div><div class="w">${esc(S.T.watch)}</div><button class="opt" data-act="dawn">天亮</button>`;
}
const onSleep = () => run(async () => {
  if (S.T.special === 'night') { say('班主', '夜场散了。你从后台出来，街上已经没人了。', `金箔 +${R.nightShow} · 被看见 −1`); await wait(2000); }
  sleep(S);
  view = 'watch';
  showWatch();
});
const onDawn = () => run(async () => {
  $('#watch').hidden = true;
  dawn(S);
  if (S.phase === 'week') { view = 'week'; sheet = { k: 'week' }; placeScene(); say('', ''); return; }
  toMorning();
});
const onNextWeek = () => run(async () => {
  nextWeek(S);
  if (S.phase === 'end') { view = 'end'; sheet = { k: 'end' }; placeScene(); say('', ''); return; }
  toMorning();
});

$('#title').addEventListener('input', e => { if (e.target.id === 'nm') draftName = e.target.value; });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, arg = b.dataset.arg, id = Number(arg);
  switch (a) {
    case 'start': setTutPref(!!$('#tutChk')?.checked); startGame((draftName.trim() || '小满').slice(0, 6)); return;
    case 'coachnext': coachNext(); break;
    case 'coachbtn': LESSONS[coach.lesson][coach.i].btn.fn(); coachNext(); break;
    case 'coachskip': coachSkip(); say('', '教学关掉了。规矩随时点右上角「规矩」。'); break;
    case 'coachclose': coach.lesson = null; break;
    case 'coachreplay': coachStart(sheet && sheet.k === 'combo' ? 'combo' : view, true); panel = null; break;
    case 'cont': continueGame(); return;
    case 'rules': panel = panel === 'rules' ? null : 'rules'; break;
    case 'close': panel = null; break;
    case 'opt': S.opt.listenRift = !S.opt.listenRift; break;
    case 'script': pickScript(S, id); break;
    case 'special': choose(S, arg); setBoxStack(S.T.box.length); break;
    case 'plus': stepTpl(S, arg, 1); setBoxStack(S.T.box.length); break;
    case 'minus': stepTpl(S, arg, -1); setBoxStack(S.T.box.length); break;
    case 'yesterday': boxYesterday(S); setBoxStack(S.T.box.length); break;
    case 'clear': clearBox(S); setBoxStack(0); break;
    case 'edit': editDeck = !editDeck; break;
    case 'stash': stash(S, id); setBoxStack(S.T.box.length); break;
    case 'unstash': unstash(S, id); break;
    case 'buy': if (buyShop(S, arg)) say('班主', `「${T[arg].n}」归你了。`, `金箔 −${T[arg].price}`); break;
    case 'depart': onDepart(); return;
    case 'nextseg': nextSeg(S); say('', `${SEG_N[S.T.seg]}段：要${FAM[scriptNow(S).segs[S.T.seg]].n}。`); break;
    case 'endstage': onEndStage(); return;
    case 'todoor': onToDoor(); return;
    case 'wipe': onWipe(); return;
    case 'self': onSelf(); return;
    case 'keep': mode = null; say('', '你留着这层。'); break;
    case 'enter': onEnter(); return;
    case 'look': lookOpen = !lookOpen; break;
    case 'endeve': onEndEvening(); return;
    case 'trayyes': onTray(true); return;
    case 'trayno': onTray(false); return;
    case 'closesheet': sheet = null; updateMirror(0); break;
    case 'sleep': onSleep(); return;
    case 'dawn': onDawn(); return;
    case 'nextweek': onNextWeek(); return;
    case 'again': startGame(S.name); return;
    case 'home': saved = load(); S = null; coach.lesson = null; view = 'title'; sheet = null; panel = null; clear3DCards(); camLook = null; if (glOK) { setScene('dress', 'night'); placeWife('dress', V(0.72, 0, -0.62), 'idle', -0.35); } refresh(); return;
    case 'card':
      if (view === 'morning') { toggleBox(S, id); setBoxStack(S.T.box.length); break; }
      if (view === 'stage') { onStage(id); return; }
      if (view === 'evening') { onHome(id); return; }
      if ((view === 'night' || view === 'door') && mode === 'cloth') { onClean(id); return; }
      break;
  }
  refresh();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel) { panel = null; refresh(); } });

// 測試用：在主控台裡看規則與流程
window.__dise = { R, T, newGame, endingOf, combosOf, get S() { return S; }, get view() { return view; } };

(async function boot() {
  const glyphs = Object.values(T).map(t => t.n).join('') + Object.values(FAM).map(f => f.n + (f.res || '') + (f.eff || '')).join('') + Object.values(SIG).join('') + '底色戏城台上金残留招专位起承转唱念做打顾陪听劳冲礼安心被看见裂痕伤手灯对路';
  try { await Promise.race([Promise.all([document.fonts.load('40px "Ma Shan Zheng"', glyphs), document.fonts.load('16px "Noto Serif SC"', glyphs)]), wait(3500)]); } catch (e) { /* 字體載不到就用後備字體 */ }
  initGL();
  saved = load();
  if (glOK) { setScene('dress', 'night'); placeWife('dress', V(0.72, 0, -0.62), 'idle', -0.35); drawPortrait(mirrorCv, { who: 'you', layers: [], bg: ['#8d9396', '#3b4044'] }); mirrorTex.needsUpdate = true; }
  refresh();
})();
