<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>底色</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* 版面：一張梳妝桌。左邊是你的臉（拖卡上妝、按住擦臉卸妝），右邊是眼前這一場，底下是妝奩和香。紙本油彩的單一風格，夜裡轉成墨色。 */
:root {
  color-scheme: light;
  --paper: #f7f2f1;   /* 油彩白 */
  --card: #fbf8f7;    /* 乾淨的卸妝布 */
  --ink: #211c1f;     /* 墨 */
  --ink-2: #5a5156;
  --ink-3: #8b7f84;
  --rouge: #a8243a;   /* 胭脂：戲台紅 */
  --gold: #a8843a;    /* 金箔 */
  --gold-2: #efe2c2;
  --indigo: #2e4256;  /* 黛青 */
  --indigo-2: #d9e0e7;
  --line: #ddd1d1;
  --night: #19161b;
  --ash: #cfc6c6;
  --display: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.7; }
button { font: inherit; color: inherit; }
p { margin: 0; }
.app { max-width: 1120px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }

/* 頂欄與水牌 */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
.brand { font-family: var(--display); font-size: 26px; line-height: 1; background: var(--ink); color: var(--card); padding: 7px 10px 5px; letter-spacing: .12em; }
.when { display: flex; flex-direction: column; line-height: 1.25; }
.when b { font-family: var(--display); font-size: 24px; font-weight: 400; }
.when span { font-size: 12px; color: var(--ink-2); letter-spacing: .2em; }
.board { margin-left: auto; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.board b { font-family: var(--display); font-size: 24px; font-weight: 400; color: var(--gold); font-variant-numeric: tabular-nums; }
.board .rival b { color: var(--ink-2); }
.board .pass { border: 1px solid var(--rouge); color: var(--rouge); padding: 0 7px; font-size: 12px; letter-spacing: .1em; }
.tools { display: flex; gap: 8px; }
.tool { background: none; border: 1px solid var(--ink-3); padding: 4px 12px; font-size: 13px; cursor: pointer; min-height: 34px; }

/* 梳妝桌 */
.table { display: grid; grid-template-columns: minmax(250px, 330px) minmax(0, 1fr); grid-template-areas: "face head" "face target" "tray tray" "rest rest"; gap: 14px 22px; align-items: start; }
.facezone { grid-area: face; background: var(--card); padding: 14px 16px 14px; border-top: 6px solid var(--ink); min-height: var(--face-h, 484px); }
.head { grid-area: head; background: var(--card); padding: 18px 22px; border-top: 6px solid var(--rouge); min-width: 0; }
.head.home { border-top-color: var(--indigo); }
.head.night { background: var(--night); color: var(--card); border-top-color: var(--gold); }
.target { grid-area: target; }
.tray { grid-area: tray; background: var(--night); color: var(--card); padding: 14px 18px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 32px; align-items: end; }
.rest { grid-area: rest; min-width: 0; }
.tray h3 { font-size: 12px; font-weight: 400; letter-spacing: .3em; color: var(--gold-2); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 10px; }
.tray h3 b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .05em; color: var(--card); }

/* 臉：拖卡的落點，也是擦臉的地方 */
.face { position: relative; width: 100%; max-width: 236px; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
.face .portrait { width: 100%; height: auto; display: block; }
.face.wipeable { cursor: pointer; }
.face .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.face .ring ellipse { transition: stroke-dasharray .12s linear; }
.face.helping .ring ellipse { transition: stroke-dasharray .75s ease-in-out; }
.face::after { content: ""; position: absolute; inset: 2% 3% 0; border: 2px dashed transparent; border-radius: 48% / 44%; pointer-events: none; }
.face.can::after { border-color: var(--gold); }
.face.over::after { border-style: solid; border-color: var(--gold); background: rgba(168, 132, 58, .1); }
.face:focus-visible::after { border-color: var(--gold); border-style: solid; }
.face.shake { animation: shake .32s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.helper { position: absolute; left: 50%; top: 40%; width: 110px; pointer-events: none; transform: translate(-150%, -50%) rotate(-10deg); }
.helper[hidden] { display: none; }
.face.helping .helper { animation: helpwipe .75s ease-in-out; }
@keyframes helpwipe { 0% { transform: translate(-150%, -50%) rotate(-10deg); } 45% { transform: translate(10%, -20%) rotate(8deg); } 70% { transform: translate(-60%, -60%) rotate(-6deg); } 100% { transform: translate(60%, -40%) rotate(10deg); opacity: 0; } }
#towel { position: fixed; left: 0; top: 0; width: 64px; pointer-events: none; z-index: 60; }
#towel[hidden] { display: none; }
.wipe-cap { font-size: 13px; color: var(--ink-2); text-align: center; margin-top: 6px; line-height: 1.55; }
.wipe-cap b { color: var(--ink); font-weight: 700; }
.layers { list-style: none; padding: 0; margin: 10px 0 0; }
.layers li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.chip { width: 14px; height: 14px; flex: none; }
.tag { margin-left: auto; font-size: 11px; letter-spacing: .06em; padding: 0 6px; border: 1px solid var(--ink-3); color: var(--ink-2); white-space: nowrap; }
.tag.leak { border-color: var(--rouge); color: var(--rouge); }
.bare { font-size: 13px; color: var(--ink-2); padding: 5px 0; border-bottom: 1px solid var(--line); margin-top: 10px; }

/* 場景文字 */
.sh { display: flex; align-items: center; gap: 14px; }
.sh svg { width: 52px; height: 52px; flex: none; }
.sh h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.1; letter-spacing: .08em; }
.sh .who { font-size: 13px; color: var(--ink-2); letter-spacing: .15em; }
.night .sh .who { color: var(--gold-2); }
.morning { font-size: 13px; letter-spacing: .1em; color: var(--ink-2); margin-top: 10px; }
.desc { margin-top: 10px; font-size: 16px; }
.say { font-family: var(--display); font-size: 22px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
.watch-line { font-family: var(--display); font-size: 25px; line-height: 1.6; margin: 14px 0 0; animation: rise .9s ease both; }
.watch-line:nth-child(2) { animation-delay: .8s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 落點：戲台、鏡子、對方 */
.zone { width: 100%; background: var(--card); border: 2px dashed var(--ink-3); padding: 14px 18px; min-height: 104px; display: flex; gap: 16px; align-items: center; cursor: pointer; text-align: left; }
.zone svg { width: 62px; height: 62px; flex: none; }
.zone .zt { display: block; font-family: var(--display); font-size: 26px; line-height: 1.2; }
.zone small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.zone.can { border-color: var(--gold); background: #fffaf0; }
.zone.over { border-style: solid; border-color: var(--gold); background: var(--gold-2); }
.zone:disabled { cursor: default; }
.zone:disabled .zt { color: var(--ink-3); }
.zone:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* 妝奩：面具卡 */
.cards { display: flex; gap: 10px; flex-wrap: wrap; }
.card { width: 78px; height: 112px; border: none; background: var(--card); position: relative; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 3px 0 rgba(0, 0, 0, .45); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 2px 6px; color: var(--ink); }
.card svg { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 60px; height: 72px; }
.card .cn { font-family: var(--display); font-size: 17px; line-height: 1.1; position: relative; }
.card small { font-size: 10px; color: var(--ink-2); line-height: 1.3; position: relative; }
.card:disabled { opacity: .32; cursor: not-allowed; }
.card.slot { background: none; border: 1px dashed rgba(251, 248, 247, .35); box-shadow: none; cursor: default; justify-content: center; color: var(--ash); font-size: 12px; letter-spacing: .1em; }
.card.lifted, .token.lifted { opacity: .25; }
.card:focus-visible, .token:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* 香 */
.tokens { display: flex; gap: 7px; align-items: flex-end; flex-wrap: wrap; }
.token { width: 20px; height: 66px; border: none; padding: 0; background: none; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.token svg { width: 100%; height: 100%; display: block; }
.token.ash { cursor: default; }
.token.missing { border: 1px dashed rgba(251, 248, 247, .35); height: 58px; }
.token.flash { animation: burn .9s ease; }
@keyframes burn { 0% { filter: brightness(2.2); transform: translateY(-4px); } 100% { filter: none; transform: none; } }
.tray .hint { color: var(--ash); font-size: 12px; margin-top: 8px; }

.ghost { position: fixed; left: 0; top: 0; margin: 0; pointer-events: none; z-index: 50; filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .3)); }

/* 筆記與離開 */
.notes { padding: 10px 14px; background: var(--card); font-size: 14px; border-left: 4px solid var(--line); }
.notes p + p { margin-top: 3px; }
.notes .g { color: var(--gold); }
.notes .r { color: var(--rouge); }
.leave { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--card); padding: 9px 14px; cursor: pointer; text-align: left; line-height: 1.35; min-height: 44px; }
.btn small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.btn.main { background: var(--ink); color: var(--card); }
.btn.main small { color: var(--gold-2); }
.btn.go { background: var(--rouge); border-color: var(--rouge); color: var(--card); }
.btn.go small { color: #f3d9dc; }
.btn:disabled { opacity: .36; cursor: not-allowed; }
.btn:focus-visible, .tool:focus-visible, .pick:focus-visible, .cloth:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

/* 開場 */
.start { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: start; max-width: 960px; margin: 3vh auto 0; }
.vboard { background: var(--ink); color: var(--card); font-family: var(--display); padding: 30px 22px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.vboard::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gold); pointer-events: none; }
.vboard .t { writing-mode: vertical-rl; font-size: 92px; line-height: 1; letter-spacing: .12em; }
.vboard .s { writing-mode: vertical-rl; font-size: 17px; color: var(--gold-2); letter-spacing: .3em; }
.intro { font-family: var(--display); font-size: 25px; line-height: 1.75; }
.lede { margin-top: 10px; color: var(--ink-2); max-width: 40em; }
.form { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; }
.field label { display: block; font-size: 13px; letter-spacing: .2em; color: var(--ink-2); margin-bottom: 6px; }
.field input { font: inherit; font-size: 18px; padding: 7px 12px; border: 1px solid var(--ink); background: var(--card); width: 9em; }
.picks { display: flex; gap: 6px; }
.pick { border: 1px solid var(--ink); background: var(--card); padding: 4px 14px; font-family: var(--display); font-size: 24px; cursor: pointer; min-width: 48px; min-height: 44px; }
.pick[aria-pressed="true"] { background: var(--rouge); border-color: var(--rouge); color: var(--card); }
.rules-card { background: var(--card); padding: 14px 20px 16px; margin-top: 22px; font-size: 14px; border-left: 5px solid var(--gold); }
.rules-card h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 4px; letter-spacing: .1em; }
.rules-card ol { margin: 0; padding-left: 1.4em; }
.rules-card li + li { margin-top: 3px; }

/* 對話框 */
.backdrop { position: fixed; inset: 0; background: rgba(25, 22, 27, .55); z-index: 20; }
.modal { position: fixed; z-index: 21; left: 50%; top: 6vh; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); max-height: 86vh; overflow: auto; background: var(--card); padding: 20px 24px 24px; border-top: 6px solid var(--ink); }
.modal h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0 0 8px; letter-spacing: .1em; }
.modal .close { position: absolute; right: 12px; top: 10px; }
.dline { padding: 10px 0; border-bottom: 1px solid var(--line); }
.dline b { font-family: var(--display); font-weight: 400; font-size: 20px; margin-right: 8px; }
.dline .w { font-family: var(--display); font-size: 18px; color: var(--ink-2); }

/* 揭曉 */
.reveal { max-width: 880px; margin: 0 auto; }
.rv { background: var(--card); padding: 26px 28px 28px; border-top: 6px solid var(--gold); }
.rv h2 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.2; margin: 0 0 8px; letter-spacing: .1em; }
.rv .big { font-family: var(--display); font-size: 24px; line-height: 1.7; }
.rv .actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.rv .face { margin-top: 14px; max-width: 220px; }
.wb { margin-top: 16px; border-top: 2px solid var(--ink); }
.wb div { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 17px; }
.wb .me { font-weight: 700; }
.wb .me span::after { content: "（你）"; color: var(--rouge); font-weight: 400; font-size: 14px; }
.wb b { font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--gold); font-variant-numeric: tabular-nums; }
.stamp { display: inline-block; margin-top: 14px; font-family: var(--display); font-size: 26px; padding: 4px 16px; border: 3px solid var(--rouge); color: var(--rouge); transform: rotate(-4deg); letter-spacing: .2em; }
.stamp.fail { border-color: var(--ink-2); color: var(--ink-2); }
.cloths { display: grid; grid-template-columns: 56px repeat(5, minmax(0, 1fr)); gap: 8px; align-items: center; margin-top: 16px; max-width: 600px; }
.cloths .h { font-size: 12px; color: var(--ink-3); text-align: center; letter-spacing: .1em; }
.cloths .who { font-family: var(--display); font-size: 20px; }
.cloth { aspect-ratio: 1; border: none; background: none; padding: 0; cursor: pointer; max-width: 100%; }
.cloth svg { width: 100%; height: 100%; display: block; }
.cloth[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 14px; }
.cinfo { margin-top: 14px; min-height: 72px; background: var(--paper); padding: 12px 16px; }
.facts { margin-top: 14px; font-size: 14px; color: var(--ink-2); }
.back { margin-top: 14px; }
.back div { padding: 12px 0; border-bottom: 1px solid var(--line); }
.back .nm { font-family: var(--display); font-size: 22px; margin-right: 10px; }
.back .tx { font-family: var(--display); font-size: 22px; }
.back small { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ending { margin-top: 16px; padding: 24px 26px; }
.ending h3 { font-family: var(--display); font-weight: 400; font-size: 60px; line-height: 1.1; margin: 0; letter-spacing: .15em; }
.ending .cond { font-size: 13px; letter-spacing: .12em; opacity: .8; margin-top: 4px; }
.ending .tx { font-family: var(--display); font-size: 25px; line-height: 1.7; margin-top: 14px; }
.ending .mean { font-size: 14px; margin-top: 10px; }
.end-liubai { background: var(--paper); border: 1px solid var(--line); }
.end-suian { background: var(--indigo-2); }
.end-toupai { background: var(--gold-2); }
.end-gengfu { background: var(--night); color: var(--card); }
.night-line { font-family: var(--display); font-size: 25px; margin-top: 12px; }

/* 金箔 */
#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.fleck { position: absolute; top: -14px; width: 10px; height: 8px; background: var(--gold); animation: fall 1.7s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(560deg); opacity: .15; } }
@media (prefers-reduced-motion: reduce) {
  .fleck { display: none; }
  .watch-line, .token.flash, .face.shake, .face.helping .helper { animation: none !important; }
}

@media (max-width: 780px) {
  .table { grid-template-columns: 128px minmax(0, 1fr); grid-template-areas: "head head" "face target" "tray tray" "rest rest"; gap: 12px; }
  .facezone { padding: 10px 8px; border-top-width: 4px; --face-h: 340px; }
  .wipe-cap { font-size: 11.5px; }
  .layers li { font-size: 12px; gap: 5px; }
  .tag { font-size: 10px; padding: 0 3px; }
  .head { padding: 14px 16px; }
  .sh h2 { font-size: 28px; }
  .desc { font-size: 15px; }
  .say { font-size: 19px; }
  .zone { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; min-height: 0; }
  .zone svg { width: 46px; height: 46px; }
  .zone .zt { font-size: 22px; }
  /* 手機：妝奩固定在螢幕底部，臉、落點和卡片能同時看到 */
  .tray { position: sticky; bottom: 0; z-index: 5; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 16px rgba(0, 0, 0, .2); }
  .tray h3 { font-size: 11px; letter-spacing: .15em; margin-bottom: 4px; }
  .tray h3 b { font-size: 16px; }
  .tray .hint { display: none; }
  .cards { gap: 6px; flex-wrap: nowrap; }
  .card { width: 52px; height: 76px; padding-bottom: 4px; }
  .card svg { width: 42px; height: 50px; top: 4px; }
  .card .cn { font-size: 13px; }
  .card small { display: none; }
  .tokens { gap: 3px; }
  .token { width: 14px; height: 50px; }
  .token.missing { height: 44px; }
  .layers li { padding: 2px 0; }
  .sh svg { width: 40px; height: 40px; }
  .bar { gap: 6px 12px; margin-bottom: 10px; padding-bottom: 8px; }
  .when b { font-size: 20px; }
  .board { margin-left: 0; width: 100%; font-size: 12px; }
  .board b { font-size: 20px; }
}
@media (max-width: 620px) {
  .start { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .vboard { flex-direction: row; justify-content: center; padding: 16px 20px; }
  .vboard .t { writing-mode: horizontal-tb; font-size: 56px; }
  .vboard .s { writing-mode: horizontal-tb; font-size: 14px; }
  .intro { font-size: 21px; }
  .cloths { grid-template-columns: 40px repeat(5, minmax(0, 1fr)); gap: 5px; }
  .cloths .who { font-size: 16px; }
  .ending h3 { font-size: 44px; }
}
</style>

<div id="app" class="app"></div>
<div id="fx" aria-hidden="true"></div>
<div id="towel" hidden aria-hidden="true"></div>

<script>
/* ENGINE START */
// 規則數值與 設計/模擬/sim.py 一致（v0.1）
const R = { days: 5, base: 6, thr: 5, start: 5, max: 10, workMin: 3, workMax: 5, deliver: 2, homePen: 1, care: 2, careMore: 1, absent: 1, pass: 58 };
// [底層面具][場景] = [金箔, 對方安心, 本場陪伴折損]
const LEAK = { W: { F: [1, -2, 1], P: [1, -2, 1] }, F: { W: [-1, 0, 0], P: [0, -1, 0] }, P: { W: [-2, 0, 0], F: [0, -1, 0] } };
// 週四是素娘的生日：第一次陪伴 +3，缺席 −3
let EVENTS = { 3: { F: { careFirst: 3, absent: 3 } } };
const RIVAL = [12, 12, 9, 13, 12];
const SC = ['W', 'F', 'P'];
const DAYS = ['周一', '周二', '周三', '周四', '周五'];
const MASK = { W: { name: '戏台脸' }, F: { name: '乖脸' }, P: { name: '阿檀的脸' } };

    if (s.leaked) c.push([1, 'leak' + s.leaked + who]);
    if (!s.cared) c.push(s.practiced ? [3, 'practice' + who] : [2, bday && who === 'F' ? 'bdayAbsent' : 'absent' + who]);

function wipeInfo() {
  if (!S) return { mode: 'none', ok: false };
  if (S.phase === 'reveal') {
    const rv = S.reveal;
    return { mode: 'reveal', ok: rv.step === 1 && !rv.washed, free: false, need: rv.stack.length ? 1100 : 320 };
  }
  if (S.phase === 'scene') {
    const c = S.sc, cost = unmaskCost(S, c.scene), ok = canUnmask(S);
    let reason = '';
    if (!S.stack.length) reason = '脸上没有妆。';
    else if (c.locked) reason = '已经开始做事，妆换不了了。';
    else if (c.pushed) reason = '这一场画过妆了，卸不了了。';
    else if (!ok) reason = '香不够了。';
    return { mode: 'scene', ok, free: cost === 0, need: 900, reason, helper: WHO[c.scene], stage: c.scene === 'W' };
  }
  if (S.phase === 'sleep') {
    const cost = sleepCost(S), n = S.stack.length;
    return { mode: 'sleep', ok: n > 0 && S.t >= cost, free: cost === 0, cost, need: 900 + 300 * Math.max(0, n - 1), reason: n ? '香不够了。' : '脸上没有妆。', helper: '阿檀' };
  }
  return { mode: 'none', ok: false };
}
function wipeKey() {
  return S ? `${S.phase}-${S.day}-${S.si}-${S.stack.length}-${S.reveal ? S.reveal.stack.length : ''}` : '';
}

  }
  if (wi.mode === 'sleep') {
    if (!S.stack.length) return '你脸上什么都没有。';

function setRing(p) {

function startWipe(e, face) {

function accepts(zone, kind, arg) {

  if (kind === 'token') return zone.dataset.drop === 'act' && canAct(S);

}

    const r = drag.src.getBoundingClientRect();
    const g = drag.src.cloneNode(true);
    g.classList.add('ghost');
    g.removeAttribute('data-drag');
    g.style.width = `${r.width}px`;
    g.style.height = `${r.height}px`;
    drag.dx = drag.x0 - r.left;
    drag.dy = drag.y0 - r.top;
    document.body.appendChild(g);
    drag.ghost = g;
    drag.src.classList.add('lifted');
    document.body.classList.add('is-dragging');
    app.querySelectorAll('[data-drop]').forEach(z => z.classList.toggle('can', accepts(z, drag.kind, drag.arg)));
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px) rotate(-5deg) scale(1.06)`;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const zone = el && el.closest('[data-drop]');
  if (drag.over && drag.over !== zone) drag.over.classList.remove('over');
  drag.over = accepts(zone, drag.kind, drag.arg) ? zone : null;
  if (drag.over) drag.over.classList.add('over');
}
function endDrag(e) {

  if (d.ghost) d.ghost.remove();
  document.body.classList.remove('is-dragging');
  app.querySelectorAll('.can, .over, .lifted').forEach(el => el.classList.remove('can', 'over', 'lifted'));
  if (!d.moved) { perform(d.kind, d.arg); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const zone = el && el.closest('[data-drop]');
  if (accepts(zone, d.kind, d.arg)) perform(d.kind, d.arg);
}

    return `<section class="head"><div class="sh">${emblem('W')}<div><h2>大戏台</h2><div class="who">班主 · 魏老板</div></div></div>
      ${fresh ? `<p class="morning">枕边的香有 ${S.dayLen} 寸。</p>` : ''}<p class="desc">${STAGE_DESC[S.day]}</p>
      <p class="say">${c.acts >= R.workMax ? '魏老板拍了拍你的肩：「留得晚，好。」' : '魏老板：「金箔不会骗人。」'}</p></section>`;
  }
  if (sc === 'F') {
    const bday = (EVENTS[S.day] || {}).F;
    return `<section class="head home"><div class="sh">${emblem('F')}<div><h2>豆花摊</h2><div class="who">母亲 · 素娘</div></div></div>
      <p class="desc">${bday ? '今天是素娘的生日，摊子上摆着一碗长寿面。' : ''}${F_DESC[c.tier]}</p><p class="say">${F_SAY[c.tier]}</p></section>`;
  }
  return `<section class="head home"><div class="sh">${emblem('P', c.tier === 'cold')}<div><h2>灯坊</h2><div class="who">伴侣 · 阿檀</div></div></div>
    <p class="desc">${P_DESC[c.tier]}</p><p class="say">${P_SAY[c.tier]}</p></section>`;
}
function viewTarget() {
  if (S.phase !== 'scene') return '<div class="target"></div>';
  const c = S.sc, sc = c.scene, a = actionFor(S), can = canAct(S);
  let kind, title, sub;
  if (sc === 'W') { kind = 'W'; title = '戏台'; sub = `把一根香拖上台，唱一寸戏，金箔 +2。已唱 ${c.acts} 寸（至少 3，最多 5）。`; }
  else if (a === 'practice') { kind = 'mirror'; title = '对镜练戏'; sub = '把一根香拖到镜子前，练一寸戏，金箔 +2。'; }
  else { kind = sc; title = `陪${WHO[sc]}`; sub = `把一根香拖过来，陪${WHO[sc]}一寸。`; }
  if (!can) {
    if (!a) sub = !S.stack.length ? '先把一张脸拖到脸上。' : sc === 'W' ? '要戴着戏台脸才能唱。' : '最上面这张脸，在这里用不上。';
    else if (S.t < 1) sub = '香烧完了。';
    else if (sc === 'W' && c.acts >= R.workMax) sub = '今天最多唱 5 寸。';
  }
  return `<button class="zone target" data-drop="act" data-act="zone" ${can ? '' : 'disabled'}>${emblem(kind, c.tier === 'cold')}<span><span class="zt">${title}</span><small>${sub}</small></span></button>`;
}
function cardReason(m) {
  if (S.phase !== 'scene') return '现在不能画妆';
  const c = S.sc;
  if (c.locked) return '已经开始做事';
  if (c.pushed) return '这一场画过了';
  if (S.t < 1) return '香烧完了';
  return '这里用不上';
}
function viewTray() {
  if (S.phase === 'watch') return '<div class="tray" hidden></div>';
  const cards = ['W', 'F', 'P'].map(m => {
    if (S.stack.includes(m)) return '<div class="card slot" aria-hidden="true">在脸上</div>';
    const ok = S.phase === 'scene' && canPush(S, m);
    return `<button class="card" data-drag="card" data-arg="${m}" ${ok ? '' : 'disabled'} title="${ok ? '拖到脸上画上去' : cardReason(m)}" aria-label="${MASK[m].name}，${ok ? '拖到脸上，或按 Enter 画上去' : cardReason(m)}">${cardSVG(m)}<span class="cn">${MASK[m].name}</span><small>${ok ? USE[m] : cardReason(m)}</small></button>`;
  }).join('');
  const canUse = S.phase === 'scene' && canAct(S);
  const tokens = Array.from({ length: 8 }, (_, i) => {
    if (i >= S.dayLen) return '<span class="token missing" aria-hidden="true"></span>';
    const fl = flash && i >= flash.from && i < flash.to ? ' flash' : '';
    if (i >= S.t) return `<span class="token ash${fl}" aria-hidden="true">${ASH}</span>`;
    return `<button class="token" data-drag="token" ${canUse ? '' : 'disabled'} aria-label="一根香，${canUse ? '拖到落点上，或按 Enter 使用' : '现在用不上'}">${TOKEN}</button>`;
  }).join('');
  return `<section class="tray" aria-label="妆奁与香">
    <div><h3>妆奁</h3><div class="cards">${cards}</div></div>
    <div><h3><span>枕边的香</span><span>还剩 <b>${S.t}</b> 寸</span></h3><div class="tokens">${tokens}</div>
      ${S.phase === 'scene' && S.si === 0 && S.day === 0 && !S.sc.acts ? '<p class="hint">把戏台脸拖到脸上，再把香一根一根拖上戏台。</p>' : ''}</div>
  </section>`;
}
function viewRest() {
  if (S.phase === 'sleep') {
    return `<div class="rest"><div class="leave"><button class="btn ${S.stack.length ? '' : 'main'}" data-act="sleep">${S.stack.length ? `带妆睡<small>醒来时，${MASK[S.stack[0]].name}还在脸上</small>` : '睡吧'}</button></div></div>`;
  }
  if (S.phase === 'watch') {
    return `<div class="rest"><div class="leave"><button class="btn main" data-act="dawn">${S.day === R.days - 1 ? '天亮了，水牌要重写了' : '天亮了'}</button></div></div>`;
  }
  const c = S.sc, sc = c.scene;
  let next;
  if (sc === 'W') next = alive(S, 'F') ? '散戏，去豆花摊' : alive(S, 'P') ? '散戏，去灯坊' : '散戏，回房间';
  else if (sc === 'F') next = alive(S, 'P') ? '离开豆花摊，去灯坊' : '离开豆花摊，回房间';
  else next = '离开灯坊，回房间';
  const why = sc === 'W' && c.acts < R.workMin ? `至少要唱 3 寸（已唱 ${c.acts} 寸）` : sc !== 'W' && c.pushed && !c.acts ? '画了的妆要先用' : sc !== 'W' && !c.cared ? `你没有陪${WHO[sc]}` : '';
  const notes = c.notes.length ? `<div class="notes" aria-live="polite">${c.notes.map(([t, k]) => `<p class="${k}">${t}</p>`).join('')}</div>` : '';
  return `<div class="rest">${notes}<div class="leave"><button class="btn go" data-act="leave" ${canLeave(S) ? '' : 'disabled'}>${next}${why ? `<small>${why}</small>` : ''}</button></div></div>`;
}
function viewPlay() {
  return `${viewBar()}<div class="table">${viewFace()}${viewHead()}${viewTarget()}${viewTray()}${viewRest()}</div>`;
}

// ── 揭曉 ─────────────────────────────────────────────
const ENDINGS = {
  liubai: { name: '留白', cond: '过线，两段关系都守住', cls: 'end-liubai', text: () => '这一出唱完，你回到家。有人伸手，接过你的毛巾。', mean: '「留白」是画里刻意不画的空白。最好的结局很安静，不放烟火。' },
  suian: { name: '素脸', cond: '没过线，至少守住一段关系', cls: 'end-suian', text: s => (s.F >= R.thr ? '你被摘了牌。第二天，你素着脸去了豆花摊。素娘看了你一会儿，多舀了一碗。' : '你被摘了牌。第二天，你素着脸去了灯坊。阿檀把糊好的灯举起来给你看。'), mean: '输了水牌，终于用自己的脸见他们。' },
  toupai: { name: '头牌', cond: '过线，但没守住两段关系', cls: 'end-toupai', text: s => (s.F <= 0 || s.P <= 0 ? '门开了一条缝：「你找谁？」' : '') + '名字挂上了水牌的高处。回到家，你对着镜子擦脸，露出来的，是戏台上那张。', mean: '你赢了，但台上那张脸，已经变成你的底色。' },
  gengfu: { name: '更夫', cond: '没过线，两段关系也没守住', cls: 'end-gengfu', text: () => '春天，城里多了一个不上妆的更夫。你接过梆子，上面刻着一长串名字。', mean: '那些名字，都是之前的更夫。最常走到这里的，是每晚都回家、却从不卸妆的人。' },
};
function viewReveal() {
  const rv = S.reveal, pass = S.gold >= R.pass;
  if (rv.step === 0) {
    const rows = [{ n: `二路 · ${S.role} · ${esc(S.name)}`, g: S.gold, me: true }, { n: '二路 · 旦 · 小凤', g: RIVAL.reduce((a, b) => a + b, 0) }].sort((a, b) => b.g - a.g);
    return `<div class="reveal"><section class="rv"><h2>水牌重写</h2><p class="big">天刚亮，全城围在戏园门口。班主把这一出的金箔秤完，一个一个名字重新写上去。</p>
      <div class="wb">${rows.map(r => `<div class="${r.me ? 'me' : ''}"><span>${r.n}</span><b>${r.g}</b></div>`).join('')}</div>
      <div class="stamp ${pass ? '' : 'fail'}">${pass ? '过线 · 留牌' : '没过线 · 摘牌'}</div>
      <p class="big" style="margin-top:12px">${pass ? '锣鼓响了，金箔落了一台。所有人都在为你叫好。' : '你的名字，被摘了下来。'}</p>
      <div class="actions"><button class="btn go" data-act="rv-next">人散了，回家</button></div></section></div>`;
  }
  if (rv.step === 1) {
    const wi = wipeInfo(), done = rv.washed;
    const cap = done ? '脸上什么都没有了。' : rv.stack.length ? `按住脸来回擦，卸下最上面那层。还有 ${rv.stack.length} 层。` : '你脸上已经没有妆了。按住脸，抹一把。';
    return `<div class="reveal"><section class="rv"><h2>两个木匣</h2>
      <p class="big">你走回家。桌上摆着两个木匣，一个是素娘的，一个是阿檀的。要打开它们，你得先亲手把脸上的妆擦下来。这一次，没有人替你擦。</p>
      ${viewFaceBlock(rv.stack, null, wi, done ? '你的脸，已经擦干净了。' : '你的脸，按住来回擦。')}
      <p class="wipe-cap">${cap}</p>
      <div class="actions"><button class="btn go" data-act="rv-next" ${done ? '' : 'disabled'}>打开木匣</button></div></section></div>`;
  }
  if (rv.step === 2) {
    const head = `<span></span>${DAYS.map(d => `<span class="h">${d}</span>`).join('')}`;
    const rowOf = who => `<span class="who">${WHO[who]}</span>` + DAYS.map((_, d) => {
      const k = `${d}${who}`, cl = clothOf(S, d, who);
      return `<button class="cloth" data-act="rv-pick" data-arg="${k}" aria-pressed="${rv.pick === k}" aria-label="${DAYS[d]}，${WHO[who]}的布">${clothSVG(cl.kind, d * 10 + (who === 'F' ? 1 : 2))}</button>`;
    }).join('');
    let info = '<p class="hint" style="margin:0">点一块布，看看那天你看见了什么、做了什么。</p>';
    if (rv.pick) { const cl = clothOf(S, +rv.pick[0], rv.pick[1]); info = `<p>${cl.saw}</p>${cl.did ? `<p><b>${cl.did}</b></p>` : ''}`; }
    const f = factsOf(S);
    return `<div class="reveal"><section class="rv"><h2>卸妆布</h2>
      <p class="big">木匣里，是这五天他们替你卸妆用过的布，按日子摊了一地。</p>
      <div class="cloths">${head}${rowOf('F')}${rowOf('P')}</div>
      <div class="legend"><span><i style="background:${COL.card};border:1px solid ${COL.ink3}"></i>干净的布：你只带着该带的脸回家</span><span><i style="background:${COL.rouge}"></i>沾红带金：你把戏台那张脸带回了家</span><span><i style="border:1px dashed ${COL.ink3}"></i>空着：那天你没有陪他们</span></div>
      <div class="cinfo">${info}</div>
      <p class="facts">这一出里：香变短了 ${f.drops} 次；回到家时，卸妆得自己烧香的有 ${f.paid} 场；更夫报了 ${f.lines} 句。</p>
      <div class="actions"><button class="btn go" data-act="rv-next">翻开水牌背面</button></div></section></div>`;
  }
  if (rv.step === 3) {
    const lines = [['F', S.F], ['P', S.P]].map(([w, v]) => `<div><span class="nm">${WHO[w]}</span><span class="tx">${BACK[w][backTier(v)]}</span><small>安心 ${v} / 10</small></div>`).join('');
    const pat = patternLine(S);
    return `<div class="reveal"><section class="rv"><h2>水牌背面</h2><p class="big">水牌翻过来，背面浮出两行字。</p><div class="back">${lines}</div>
      ${pat ? `<p class="night-line">${pat}</p>` : ''}
      <div class="actions"><button class="btn go" data-act="rv-next">五更天</button></div></section></div>`;
  }
  const e = ENDINGS[endingOf(S)];
  return `<div class="reveal"><section class="rv"><p class="night-line">五更天，窗外有人在喊「${esc(S.name)}」。</p>
    <div class="ending ${e.cls}"><h3>${e.name}</h3><p class="cond">${e.cond}</p><p class="tx">${e.text(S)}</p><p class="mean">${e.mean}</p></div>
    <div class="actions"><button class="btn go" data-act="again">再唱一出</button><button class="btn" data-act="diary">翻日记</button><button class="btn" data-act="home">回到开场</button></div></section></div>`;
}

function viewModal() {
  let body;
  if (modal === 'rules') body = `<h2>规矩</h2><ol>${RULES.map(r => `<li>${r}</li>`).join('')}</ol>`;
  else {
    const done = S ? S.log.filter(L => L.watch.length) : [];
    const after = S && S.phase === 'reveal';
    body = `<h2>日记</h2>${done.length ? done.map((L, d) => `<div class="dline"><b>${DAYS[d]}</b><span class="hint">香 ${L.incense} 寸${after ? ` · 素娘 ${L.F0} → ${L.F1} · 阿檀 ${L.P0} → ${L.P1}` : ''}</span>${L.watch.map(w => `<p class="w">${w}</p>`).join('')}</div>`).join('') : '<p class="hint">还没有过完一天。</p>'}`;
  }
  return `<div class="backdrop" data-act="close"></div><div class="modal" role="dialog" aria-modal="true">${body}<button class="tool close" data-act="close">关上</button></div>`;
}

function render(focusSel) {
  app.innerHTML = (!S ? viewStart() : S.phase === 'reveal' ? viewReveal() : viewPlay()) + (modal ? viewModal() : '');
  const el = focusSel && app.querySelector(focusSel);
  if (kbd && el && !el.disabled && document.activeElement === document.body) el.focus({ preventScroll: true });
}

function burst(n) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = document.getElementById('fx');
  for (let i = 0; i < Math.min(n, 40); i++) {
    const f = document.createElement('span');
    f.className = 'fleck';
    f.style.left = `${10 + Math.random() * 80}vw`;
    f.style.animationDelay = `${Math.random() * 0.4}s`;
    f.style.background = Math.random() < 0.3 ? COL.gold2 : COL.gold;
    fx.appendChild(f);
    setTimeout(() => f.remove(), 2400);
  }
}

app.addEventListener('input', e => { if (e.target.id === 'nm') draftName = e.target.value; });
app.addEventListener('click', e => {
  const dragSrc = e.target.closest('[data-drag]');
  if (dragSrc) {
    // 滑鼠和觸控在 pointerup 已經處理；這裡只接鍵盤的 Enter／空白鍵
    if (e.detail === 0 && !dragSrc.disabled) perform(dragSrc.dataset.drag, dragSrc.dataset.arg);
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || wiping) return;
  const a = b.dataset.act, arg = b.dataset.arg;
  const g0 = S ? S.gold : 0;
  switch (a) {
    case 'role': pickRole = arg; break;
    case 'start': S = newGame((draftName.trim() || '小满').slice(0, 6), pickRole); break;
    case 'zone': perform('zone'); return;
    case 'leave': leave(S); window.scrollTo({ top: 0 }); break;
    case 'sleep': sleep(S, false); break;
    case 'dawn': dawn(S); window.scrollTo({ top: 0 }); break;
    case 'rules': case 'diary': modal = a; break;
    case 'close': modal = null; break;
    case 'rv-next': S.reveal.step += 1; window.scrollTo({ top: 0 }); break;
    case 'rv-pick': S.reveal.pick = arg; break;
    case 'again': S = newGame(S.name, S.role); modal = null; break;
    case 'home': S = null; modal = null; break;
  }
  wipeSaved = null;
  render(modal ? '.modal .close' : arg ? `[data-act="${a}"][data-arg="${arg}"]` : `[data-act="${a}"]`);
  if (S && S.gold > g0) burst((S.gold - g0) * 3);
  if (S && a === 'rv-next' && S.reveal.step === 1 && S.gold >= R.pass) burst(30);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) { modal = null; render(); } });

window.claude?.hot?.snapshot?.(() => ({ S, pickRole, draftName }));
const boot = data => {
  if (data && data.S) { S = data.S; pickRole = data.pickRole || pickRole; draftName = data.draftName || draftName; }
  render();
};
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
